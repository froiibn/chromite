# Bundled Java runtime of the Chromite products (both the SWT and the Swing product).
# Read by tools/jre/BundleJre.java. Design, module reasons and update procedure: docs/chromite/runtime.md
#
# JetBrains Runtime SDK (JBRSDK, no JCEF): the SDK flavour is needed because only it contains the
# jmods that jlink links from; the plain "jbr" download is already a linked image without jmods.
# Release page: https://github.com/JetBrains/JetBrainsRuntime/releases/tag/jbr-release-25.0.4.1b508.41
# Archive name: jbrsdk-<version>-<platform>-<build>.tar.gz under the download URL.
jbr.version=25.0.4.1
jbr.build=b508.41
jbr.url=https://cache-redirector.jetbrains.com/intellij-jbr/

# SHA-256 of each archive. JetBrains publishes SHA-512 (<archive>.checksum); both were checked
# when the archives were pinned (runtime.md "갱신 절차").
windows-x64.sha256=c477ba00c5d8ebc108a38b29eda533fe8d6e5fad534afc332c48addd9078f719
osx-aarch64.sha256=2aa9a2944224844105ed9adac704db0eee5fb82a13d6213e79a4551c5e67ae9b

# Modules of the linked runtime (jlink --add-modules); one reason per module in runtime.md "모듈".
modules=java.se,\
  jdk.charsets,\
  jdk.localedata,\
  jdk.naming.dns,\
  jdk.security.auth,\
  jdk.security.jgss,\
  jdk.net,\
  jdk.httpserver,\
  jdk.xml.dom,\
  jdk.unsupported,\
  jdk.zipfs,\
  jdk.accessibility
# Added for one platform only (the module exists only in that platform's JBR).
windows-x64.modules=jdk.crypto.mscapi
osx-aarch64.modules=

jlink.options=--strip-debug --no-man-pages --no-header-files --compress=zip-6
