# Shell command approval dialog (SwingShellCommandsService)
shell_cmd_title = 셸 명령을 실행할까요?
shell_cmd_message = 저장된 설정에 있는 아래 셸 명령을 실행하려고 합니다. 알고 믿을 수 있는 명령일 때만 실행하세요.
shell_cmd_working_directory = 작업 폴더
shell_cmd_command = 명령
shell_cmd_always_note = 항상 허용하면 이 연결에서 이 명령과 작업 폴더를 그대로 기억합니다. 둘 중 하나라도 바뀌면 다시 묻습니다.
shell_cmd_cancel_note = 취소하면 명령을 실행하지 않고, 이 명령이 필요한 작업도 멈춥니다.
shell_cmd_run_once = 이번만 실행
shell_cmd_always = 항상 허용
