# Chromite dark theme (DataGrip-like, Darcula based). Loaded by FlatLaf for ChromiteDarkLaf on top of FlatDarculaLaf.properties.
# Only colors are customized; no third-party theme files or icons are used.

# Darker neutral gray than classic Darcula, with a brighter blue accent
@background = #2b2d30
@foreground = #dfe1e5
@accentColor = #3574f0
