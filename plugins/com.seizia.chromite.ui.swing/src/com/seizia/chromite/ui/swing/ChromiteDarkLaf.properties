# Chromite dark theme: DataGrip Islands Dark look (New UI palette), SSMS layout.
# Loaded by FlatLaf for ChromiteDarkLaf on top of FlatDarkLaf.properties.
# The values are the design tokens of docs/chromite/design-spec.md (section "Design tokens"); token names are in the comments.
# Only values are taken from the New UI palette; no third-party theme files or icons are used.
# Chromite.* keys are not FlatLaf keys: Chromite components read them with UIManager.getColor(), the sizes with UiSizes.

#---- Fonts (font.ui Pretendard 12, font.ui.semibold Pretendard SemiBold, font.code JetBrains Mono 12), same as ChromiteLightLaf.properties ----
defaultFont = 12 Pretendard
semibold.font = "Pretendard SemiBold"
monospaced.font = "JetBrains Mono"

#---- Colors ----
# bg.panel / bg.editor: the island cards (tool-window-bg, editor-bg); the canvas around them is Chromite.island.canvas
@background = #191a1c
# text.primary
@foreground = #d1d3d9
# bg.input, bg.popup, buttons
@componentBackground = #191a1c
@menuBackground = #26282c
@buttonBackground = #191a1c
# text.disabled
@disabledForeground = #5a5d63
# accent: fixed instead of the operating system accent color
@accentColor = #3871e1
# selection.bg, selection.fg (the text keeps its color), selection.inactiveBg
@selectionBackground = #2a4371
@selectionForeground = #d1d3d9
@selectionInactiveBackground = #33353b
@selectionInactiveForeground = #d1d3d9
# bg.hover (menus)
@menuHoverBackground = #2a4371
# text.secondary (shortcuts in menus)
@menuAcceleratorForeground = #73767c
@menuAcceleratorSelectionForeground = #73767c
# focus.ring (focused table cell)
@cellFocusColor = #3871e1

# border.default, focus.ring
Component.borderColor = #40434a
Component.focusColor = #3871e1
Component.focusedBorderColor = #3871e1
# text.link
Component.linkColor = #6b9bfa
# border.subtle
Separator.foreground = #26282c
ToolBar.separatorColor = #33353b
# border.popup
PopupMenu.borderColor = #33353b
Popup.borderColor = #33353b
# text.secondary (window title)
TitlePane.foreground = #73767c
# tooltip.bg / tooltip.fg
ToolTip.background = #393b40
ToolTip.foreground = #f0f1f2
ToolTip.border = line(4,8,4,8,#43454a)
# text.disabled
Label.disabledForeground = #5a5d63
# accent: primary dialog button (text.onAccent)
Button.default.background = #3871e1
Button.default.foreground = #ffffff
Button.default.focusedBackground = #3871e1
Button.default.hoverBackground = #366ace
Button.default.pressedBackground = #315fbd
Button.default.borderColor = #3871e1
Button.default.hoverBorderColor = #3871e1
Button.default.focusedBorderColor = #3871e1
Button.default.borderWidth = 1
# bg.actionHover / bg.actionPressed (icon buttons)
Button.toolbar.hoverBackground = #ffffff17
Button.toolbar.pressedBackground = #ffffff29
# Selected toggle icon buttons (tool window toggles, Actual Plan) look pressed; the FlatLaf default barely differs from the canvas
ToggleButton.toolbar.selectedBackground = #ffffff29
# icon.chevron (tree and combo arrows)
Tree.icon.expandedColor = #b4b8bf
Tree.icon.collapsedColor = #b4b8bf
ComboBox.buttonArrowColor = #b4b8bf
# bg.panel (tool window content)
Tree.background = @background
# tab.underline, tab.underlineInactive, tab.hover, border.subtle (line under the tabs)
TabbedPane.underlineColor = #3871e1
TabbedPane.inactiveUnderlineColor = #5a5d63
TabbedPane.hoverColor = #ffffff17
TabbedPane.focusColor = $TabbedPane.background
TabbedPane.contentAreaColor = #26282c
# bg.editor (result grid), grid.line
Table.background = #191a1c
TableHeader.background = #191a1c
Table.gridColor = #26282c
TableHeader.separatorColor = #26282c
TableHeader.bottomSeparatorColor = #26282c

# scroll bar thumb (Islands ScrollBar.thumbColor / hoverThumbColor; the track takes the content background: ChromiteScrollBarUI)
ScrollBar.thumb = #80808059
ScrollBar.hoverThumbColor = #8080808c
ScrollBar.pressedThumbColor = #8080808c

#---- Chromite component colors ----
Chromite.panelBackground = #191a1c
Chromite.editorBackground = #191a1c
Chromite.dividerColor = #26282c
Chromite.secondaryForeground = #73767c
# Properties grid category rows (Islands dialog-bg-inline, a band on the card background)
Chromite.PropertyGrid.categoryBackground = #212326
Chromite.Tree.hoverBackground = #ffffff10
# grid.lineSubtle (horizontal grid lines)
Chromite.Table.horizontalLineColor = #212326
# Result grid edits: new row, deleted row, changed cell
Chromite.Table.addedBackground = #2e4a33
Chromite.Table.removedBackground = #4d2f2f
Chromite.Table.changedBackground = #5a4a1f
Chromite.status.success = #5fad65
Chromite.status.warning = #f2c55c
Chromite.status.error = #db5c5c
Chromite.completion.matchForeground = #548af7

#---- Islands (DataGrip 2025.3+ default theme: ManyIslandsDark.theme.json) ----
# The main window is a canvas (main-window-bg) with the tool windows and the editor on rounded cards (tool-window-bg,
# editor-bg = @background); Island.arc 20 (radius 10), Island.borderWidth 6 = the gap between cards. IslandPanel paints them.
Chromite.island.canvas = #26282c
Chromite.island.background = @background
Chromite.island.arc = 20
Chromite.island.gap = 6
# Editor tabs: the selected tab is a rounded pill (EditorTabs.underlinedTabBackground / underlinedBorderColor,
# inactive* without focus), hovered tabs get tab-bg-hovered; tabInsets -6 = 6 above and below the pill
Chromite.island.tabSelectedBackground = #233558
Chromite.island.tabSelectedBorderColor = #2e4d89
Chromite.island.tabInactiveBackground = #26282c
Chromite.island.tabInactiveBorderColor = #40434a
Chromite.island.tabHoverBackground = #ffffff17
Chromite.island.tabArc = 12
# Tool window docking (ModernDocking): drop area in the accent color (30%), docking handles on the card color
ModernDocking.overlayBackground = #3871e14d
ModernDocking.handleBackground = $Chromite.island.background
ModernDocking.handleForeground = @accentColor
# Title bar, menu bar, main tool bar and status bar sit on the canvas (MainToolbar.background, StatusBar.background)
MenuBar.background = $Chromite.island.canvas
# The title bar takes TitlePane.background instead of the root pane color (unifiedBackground would make it the island color)
TitlePane.unifiedBackground = false
TitlePane.background = $Chromite.island.canvas
TitlePane.inactiveBackground = $Chromite.island.canvas
# ComboBox.background (control-bg-raised layer: popup-bg)
ComboBox.background = #26282c

#---- Sizes, insets and arcs (same as ChromiteLightLaf.properties; keep both files in step) ----
# Density B ("a little denser", user decision 2026-11-07): the sizes of the density are this section's FlatLaf keys
# and the Chromite.size.* keys below (UiSizes). A compact mode only has to change these values.
# size.row.tree 22, size.indent.tree 17 (6 + 11), Tree.border 3,10,3,10
Tree.rowHeight = 22
Tree.leftChildIndent = 6
Tree.rightChildIndent = 11
Tree.border = empty(3,10,3,10)
Tree.rendererMargins = 0,2,0,2
# radius.control 8 for selections, drawn inside the tree padding
Tree.selectionArc = 8
Tree.selectionInsets = 0,6,0,6
List.selectionArc = 8
List.selectionInsets = 0,4,0,4
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,4,0,4
ComboBox.selectionArc = 8
ComboBox.selectionInsets = 0,4,0,4
# radius.control 8, size.control 28, focus.ring 2px (border 1 + inner 1), no outer focus ring
# size.control 28 = the 12px text line (15) + 6 above and 5 below + the 1px border above and below
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
Component.focusWidth = 0
Component.innerFocusWidth = 1
Component.borderWidth = 1
@componentMargin = 6,8,5,8
Button.margin = 6,14,5,14
# radius.small 4
TabbedPane.closeArc = 4
TabbedPane.tabSelectionArc = 4
CheckBox.arc = 4
# radius.popup 8
Popup.borderCornerRadius = 8
PopupMenu.borderCornerRadius = 8
# size.titleBar 40: the title bar is as high as its window buttons (46 x 40)
TitlePane.buttonSize = 46,40
# size.row.menu 22: the 16px icon column (higher than the 12px text line, 15) + 3 above and below, space.8 left and right
# (menu bar items keep MenuBar.itemMargins)
@menuItemMargin = 3,8,3,8
# size.actionButton 24 (16 icon + 4 + 4); buttons with text take 1 less above (UiIcons.createToolButton)
Button.toolbar.margin = 4,4,4,4
Button.toolbar.spacingInsets = 0,1,0,1
# size.row.grid 24, size.header.grid 26, cell padding space.8 (grid lines: ResultSetGrid); the text sits 1px above the
# middle (0 above, 2 below), which looks centered for Hangul and descenders
# font.grid: the result grid keeps Table.font, the UI font (font.ui), not font.code (user decision 2026-11-07)
Table.rowHeight = 24
Table.cellMargins = 0,8,2,8
TableHeader.height = 26
TableHeader.cellMargins = 0,8,2,8
# size.scrollbar 11: a 7px round thumb (2px around it), 9px while the mouse is over the scroll bar (ChromiteScrollBarUI)
ScrollBar.width = 11
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumbArc = 999
# size.divider: the 6px gap between islands is the drag area (Island.borderWidth 6), no line and no grip dots
SplitPane.dividerSize = 6
SplitPaneDivider.style = plain

#---- Chromite component sizes (density B; read by UiSizes, design-spec "Size tokens") ----
# size.header.toolWindow 34 (+ the 1px line below), title 10 from the left, buttons 8 from the right
Chromite.size.toolWindowHeader.height = 34
Chromite.size.toolWindowHeader.padding = 0,10,0,8
# size.toolbar.toolWindow 28: 24 action buttons + 2 above and below
Chromite.size.toolWindowToolBar.padding = 2,8,2,8
# size.toolbar.main 32: 24 action buttons + 4 above and below
Chromite.size.mainToolBar.padding = 4,8,4,8
# size.toolbar.editor 32: 28 combos + 2 above and below
Chromite.size.editorToolBar.padding = 2,8,2,8
# size.tab.editor 36, the selected tab's pill 5 from the top and bottom of the tab row
Chromite.size.documentTab.height = 36
Chromite.size.documentTab.pillInset = 5
# size.tab.tool 28 (results, tool window and detail tabs)
Chromite.size.toolTab.height = 28
# size.statusBar 26, size.statusLine.query 26 (+ the 1px line above)
Chromite.size.statusBar.height = 26
Chromite.size.queryStatusLine.height = 26
# size.row.properties 22
Chromite.size.propertyRow.height = 22
# Tree rows: icon-text gap 4, gap before the secondary text (and around connection pills) space.6
Chromite.size.tree.iconTextGap = 4
Chromite.size.tree.secondaryGap = 6
# Result grid: filter bar and viewer status bar
Chromite.size.filterBar.padding = 2,4,2,4
Chromite.size.viewerStatus.padding = 1,6,1,6
