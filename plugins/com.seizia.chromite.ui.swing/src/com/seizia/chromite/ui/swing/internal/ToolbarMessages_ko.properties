toolbar_save_all = 모두 저장
toolbar_save_all_tip = 수정한 쿼리 창과 테이블 디자이너를 모두 저장합니다(Ctrl+Shift+S)
toolbar_undo_tip = 실행 취소(Ctrl+Z)
toolbar_redo_tip = 다시 실행(Ctrl+Y)
toolbar_activity_monitor_tip = 개체 탐색기에서 선택한 연결 또는 활성 쿼리 창의 연결에 대한 작업 모니터를 엽니다(Ctrl+Alt+A)
toolbar_activity_monitor_disabled_tip = 작업 모니터(Ctrl+Alt+A): 개체 탐색기에서 연결을 선택하거나 연결이 있는 쿼리 창을 활성화하십시오
toolbar_registered_servers_tip = 등록된 서버를 표시하거나 숨깁니다(Ctrl+Alt+G)
toolbar_object_explorer_tip = 개체 탐색기를 표시하거나 숨깁니다(F8)
toolbar_query_library_tip = 쿼리 라이브러리를 표시하거나 숨깁니다(Ctrl+Alt+T)
toolbar_properties_tip = 속성 창을 표시하거나 숨깁니다(F4)
toolbar_find_tip = 활성 쿼리 창에서 텍스트를 찾습니다(Ctrl+F)

toolbar_comment = 주석 처리
toolbar_comment_tip = 선택한 줄을 주석 처리합니다(Ctrl+K, Ctrl+C)
toolbar_uncomment = 주석 처리 제거
toolbar_uncomment_tip = 선택한 줄의 주석 처리를 제거합니다(Ctrl+K, Ctrl+U)
toolbar_outdent = 내어쓰기
toolbar_outdent_tip = 선택한 줄을 내어씁니다(Shift+Tab)
toolbar_indent = 들여쓰기
toolbar_indent_tip = 선택한 줄을 들여씁니다(Tab)
toolbar_format = SQL 서식 지정
toolbar_format_tip = 선택 영역 또는 스크립트 전체의 SQL 서식을 지정합니다(Ctrl+K, Ctrl+D)
toolbar_query_history = 쿼리 기록
toolbar_query_history_tip = 쿼리 창에서 실행한 문을 표시합니다

toolbar_overflow_tip = 추가 명령
