# Chromite compact mode (density C, View > Compact Mode): replaces values of the "Sizes" section of the theme properties
# (ChromiteLightLaf.properties, ChromiteDarkLaf.properties) for both themes. UiDensity gives these lines to FlatLaf as extra
# defaults, which are parsed like the theme properties and win over them. Keys that are not here keep the density B value.
# Values: the density mock C (DataGrip Compact Mode level, D:\Tools\_scratch\density-mock\), fitted to the 12px UI font;
# docs/chromite/design-spec.md "촘촘한 모드".

#---- FlatLaf keys ----
# size.row.tree 20, size.indent.tree 15 (5 + 10), Tree.border 2,8,2,8, the selection 4 inside the tree padding
Tree.rowHeight = 20
Tree.leftChildIndent = 5
Tree.rightChildIndent = 10
Tree.border = empty(2,8,2,8)
Tree.selectionInsets = 0,4,0,4
# size.row.menu 20: the 16px icon column (higher than the 12px text line, 15) + 2 above and below
@menuItemMargin = 2,8,2,8
# size.actionButton 22 (16 icon + 3 + 3)
Button.toolbar.margin = 3,3,3,3
# size.row.grid 22, size.header.grid 24, cell padding 6 (the text stays 1px above the middle)
Table.rowHeight = 22
Table.cellMargins = 0,6,2,6
TableHeader.height = 24
TableHeader.cellMargins = 0,6,2,6

#---- Chromite component sizes (UiSizes) ----
# size.header.toolWindow 30 (+ the 1px line below), title 8 from the left
Chromite.size.toolWindowHeader.height = 30
Chromite.size.toolWindowHeader.padding = 0,8,0,8
# size.toolbar.toolWindow 26: 22 action buttons + the same 2 above and below
# size.toolbar.main 28: 22 action buttons + 3 above and below
Chromite.size.mainToolBar.padding = 3,6,3,6
# size.toolbar.editor 28: 24 pickers + the same 2 above and below; picker 24 = the connection or database icon (16, higher
# than the 12px text line, 15) + 3 above and below + the 1px border above and below
Chromite.size.editorToolBar.comboBox.padding = 3,8,3,8
# size.tab.editor 32, the selected tab's pill 4 from the top and bottom of the tab row
Chromite.size.documentTab.height = 32
Chromite.size.documentTab.pillInset = 4
# size.tab.tool 26
Chromite.size.toolTab.height = 26
# size.statusBar 24, size.statusLine.query 24 (+ the 1px line above)
Chromite.size.statusBar.height = 24
Chromite.size.queryStatusLine.height = 24
# size.row.properties 20
Chromite.size.propertyRow.height = 20
# Tree rows: gap before the secondary text 5 (the icon-text gap stays 4)
Chromite.size.tree.secondaryGap = 5
# Result viewer status bar: no padding above and below
Chromite.size.viewerStatus.padding = 0,6,0,6
