# Approval of code from connection settings (ExecutionApprovalDialog)
approval_connection = 연결
approval_url = URL
approval_allow = 허용
approval_allow_connect = 허용하고 연결
approval_cancel_note = 취소하면 연결하지 않습니다. 아무것도 실행되지 않습니다.
init_approval_title = 초기화 SQL을 실행할까요?
init_approval_message = 연결하면 연결 설정에 있는 아래 초기화 SQL(URL의 INIT= 또는 연결의 초기화 쿼리)이 가장 먼저 실행됩니다. 파일을 읽고 쓰거나 네트워크에 접근할 수 있습니다. 알고 믿을 수 있는 SQL일 때만 허용하세요.
init_approval_script = SQL
init_approval_remember_note = 허용하면 이 연결과 URL에서 이 SQL을 기억합니다. 둘 중 하나라도 바뀌면 다시 묻습니다.
sqlite_ext_title = SQLite 네이티브 확장을 불러올까요?
sqlite_ext_message = 이 SQLite 연결은 네이티브 확장을 불러옵니다(enable_load_extension). 확장은 Chromite 안에서 사용자 권한으로 실행되는 코드입니다. 알고 믿을 수 있는 확장일 때만 허용하세요.
sqlite_ext_libraries = 라이브러리
sqlite_ext_queries = 초기화 SQL
sqlite_ext_remember_note = 허용하면 이 연결에서 이 설정을 기억합니다. 설정이 바뀌면 다시 묻습니다.

# Disconnecting several connections, Invalidate/Reconnect (ConnectionCommands, ExitTransactionCheck)
disconnect_others = 다른 연결 끊기
disconnect_all = 모두 연결 끊기
disconnect_many_txn_message = 다음 연결에 커밋하지 않은 트랜잭션이 있습니다.\n{0}\n\n연결을 끊으면 트랜잭션이 끝납니다. 먼저 커밋하시겠습니까, 롤백하시겠습니까? 취소하면 모든 연결과 트랜잭션을 그대로 둡니다.
invalidate = 무효화/다시 연결
invalidate_tip = 서버 연결을 끊지 않고 세션을 다시 엽니다(쿼리 창은 그대로)
reconnect_txn_message = 다음 세션에 커밋하지 않은 트랜잭션이 있습니다.\n{0}\n\n세션을 다시 열면 트랜잭션이 끝납니다. 먼저 커밋하시겠습니까, 롤백하시겠습니까? 취소하면 세션과 트랜잭션을 그대로 둡니다.
reconnect_txn_error = {0}의 트랜잭션을 끝내지 못했습니다. 세션을 다시 열지 않습니다.

# Connection lost and driver errors (DatabaseErrorDialogs)
lost_title = 연결 끊김: {0}
lost_message = {0}의 연결이 끊겼습니다. 다시 연결하면 세션을 다시 엽니다. 커밋하지 않은 트랜잭션은 먼저 묻습니다.
lost_reconnect_failed_message = {0}의 연결이 끊겼고 다시 열지 못했습니다. 연결을 끊거나(열린 트랜잭션은 먼저 묻습니다) 다시 시도하거나, 이 메시지를 닫고 그대로 두세요.
lost_reconnect = 다시 연결
lost_disconnect = 연결 끊기
lost_retry = 다시 시도
driver_config_title = 드라이버 오류
driver_config_message = {0}의 드라이버 클래스를 찾지 못했습니다. 클래스 이름이나 드라이버 파일이 잘못되었습니다. 드라이버 설정에서 확인하세요.
driver_config_edit = 드라이버 편집
driver_license_title = 연결 오류
driver_license_message = {0}의 드라이버 라이선스가 활성화되어 있지 않습니다.

# Running jobs at exit (RunningJobsCheck)
exit_jobs_title = 실행 중인 작업
exit_jobs_message = 다음 작업이 아직 실행 중입니다.\n{0}\n\n끝날 때까지 기다린 뒤 Chromite를 닫을까요, 아니면 멈추고 지금 닫을까요? 취소하면 Chromite를 닫지 않고 작업도 계속 실행합니다.
exit_jobs_more = …외 {0}개
exit_jobs_tasks = 데이터베이스 작업
exit_jobs_wait = 기다린 뒤 끝내기
exit_jobs_stop = 멈추고 끝내기
exit_jobs_waiting = 실행 중인 작업을 기다리는 중
exit_jobs_stopping = 실행 중인 작업을 멈추는 중

# Smart commit (ConnectionTypesPage, SmartCommit)
smart_commit = 스마트 커밋: 데이터를 바꾸는 문장은 수동 커밋으로 실행
smart_commit_tip = 자동 커밋 연결에서 쿼리 창의 문장이 데이터를 바꾸면 그 세션을 수동 커밋으로 바꿔, 변경을 아직 롤백할 수 있게 합니다.
smart_commit_recover = 커밋하거나 롤백한 뒤 자동 커밋으로 돌아가기
smart_commit_recover_tip = 커밋하거나 롤백하면 세션이 자동 커밋으로 돌아갑니다. 그 사이 새 트랜잭션이 열렸으면 그 트랜잭션이 끝날 때까지 기다립니다.

# Query > Auto-Commit and the SQL Editor tool bar's commit mode button (CommitModeSwitch)
commit_mode_auto = 자동 커밋
commit_mode_manual = 수동 커밋
commit_mode_unknown = 커밋 방식
commit_mode_tip_auto = 활성 쿼리 창의 세션은 문장이 끝날 때마다 커밋합니다. 누르면 이 세션을 수동 커밋으로 바꿉니다.
commit_mode_tip_manual = 활성 쿼리 창의 세션은 커밋할 때까지 변경을 트랜잭션에 둡니다. 누르면 이 세션을 자동 커밋으로 바꿉니다(열린 트랜잭션이 있으면 먼저 묻습니다).
commit_mode_tip_shared = 이 세션은 같은 연결의 다른 쿼리 창과 함께 쓰므로 그 창들에도 적용됩니다.
commit_mode_tip_unavailable = 활성 쿼리 창 세션의 자동 커밋과 수동 커밋을 바꿉니다. 창이 연결되어 있고 실행 중인 것이 없을 때 쓸 수 있습니다.
commit_mode_title = 커밋 방식
commit_mode_txn_message = {1}에 연결된 {0}의 세션에 커밋하지 않은 트랜잭션이 있습니다.\n세션을 자동 커밋으로 바꾸면 드라이버가 열린 트랜잭션을 커밋하므로 먼저 끝내야 합니다.
commit_mode_txn_cancel_note = 취소하면 세션은 수동 커밋 그대로이고 트랜잭션도 열려 있습니다.
commit_mode_commit_switch = 커밋하고 바꾸기
commit_mode_rollback_switch = 롤백하고 바꾸기
commit_mode_shared_note = {0}의 쿼리 창들이 한 세션을 함께 씁니다({1}). 커밋 방식이 그 창 모두에서 바뀝니다.
commit_mode_switch_to = {0}으로 바꾸기
commit_mode_progress = 커밋 방식을 바꾸는 중
commit_mode_running = 세션에서 문장이 실행 중입니다. 아무것도 바꾸지 않았습니다. 실행이 끝난 뒤 커밋 방식을 바꾸세요.
commit_mode_changed = 질문한 뒤 세션의 트랜잭션이 바뀌었습니다(다른 문장이 실행됨). 커밋, 롤백, 전환 모두 하지 않았습니다. 다시 시도하세요.
commit_mode_error = {1}에 연결된 {0}의 커밋 방식을 바꾸지 못했습니다. 세션의 지금 방식은 상태 줄에 보입니다.

# Transaction log: previous transactions (TransactionLogDialog)
txn_log_show_previous = 지난 트랜잭션 보이기
txn_log_show_previous_tip = 세션이 연결된 뒤의 최근 트랜잭션 문장과 각 트랜잭션이 어떻게 끝났는지도 보입니다
txn_log_col_transaction = 트랜잭션
txn_log_open = 열림
txn_log_committed = 커밋함 {0}
txn_log_rolled_back = 롤백함 {0}
