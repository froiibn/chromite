scheduler_event_status_disabled = 이벤트 스케줄러가 DISABLED입니다. 서버를 시작할 때 꺼졌습니다(event_scheduler=DISABLED). 이벤트를 쓰려면 서버 구성 파일을 바꾸고 서버를 다시 시작하십시오.
