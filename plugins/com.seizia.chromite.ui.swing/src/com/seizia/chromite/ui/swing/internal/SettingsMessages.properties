exec_tab = Query Execution
exec_default_hint = default {0}
exec_section_delimiters = Statement Delimiters
exec_delimiter = Statement delimiter
exec_delimiter_hint = default {0}; the database''s own delimiters also apply
exec_delimiter_tip = Text that ends a statement in a script; separate several delimiters with spaces
exec_ignore_native_delimiter = Ignore the database's own delimiters
exec_ignore_native_delimiter_tip = Split scripts only at the statement delimiter above, not at the delimiters of the database (for example GO)
exec_blank_line = Blank line ends a statement
exec_blank_line_tip = Smart: a blank line ends a statement when the statement before it is complete, also in scripts run with Execute. Always: a blank line ends the statement at the cursor (code completion), but scripts are split only at delimiters. Never: only delimiters end statements.
exec_blank_line_smart = Smart
exec_blank_line_always = Always
exec_blank_line_never = Never
exec_remove_trailing_delimiter = Remove the delimiter at the end of a statement before sending it
exec_remove_trailing_delimiter_tip = Some drivers reject a statement that ends with a delimiter
exec_section_parameters = Parameters
exec_parameters_enabled = Named parameters (:name)
exec_named_prefix = Named parameter prefix
exec_anonymous_parameters = Anonymous parameters (?)
exec_anonymous_mark = Anonymous parameter mark
exec_parameters_in_embedded_code = Parameters inside code blocks
exec_parameters_in_embedded_code_tip = Also look for parameters in DDL statements and in code blocks such as $$ … $$
exec_variables_enabled = Variables (${name}, @set)
exec_command_prefix = Command prefix
exec_command_prefix_tip = Lines that start with this prefix are client commands (for example @set), not SQL
exec_section_errors = Errors
exec_on_error = On error
exec_on_error_hint = an open transaction stays open either way
exec_on_error_stop = Stop the script
exec_on_error_ignore = Skip the statement and continue
exec_section_sessions = Sessions
exec_separate_connection = Query window sessions
exec_separate_connection_hint = applies to query windows that connect after the change
exec_separate_connection_tip = With a session of its own each query window has its own transaction: Commit in one window does not commit the changes of another window. A connection can override this in its Connection Properties.
exec_separate_connection_default = A session for each query window, except embedded and single-connection databases
exec_separate_connection_always = A session for each query window, always
exec_separate_connection_never = One session shared by the query windows of a connection

results_use_fetch_size = Use JDBC fetch size
results_use_fetch_size_tip = Ask the driver to read rows in portions. Some drivers (for example PostgreSQL) otherwise read the whole result before showing the first rows.
results_native_numeric = Show numbers in the database format
results_native_numeric_tip = Shows numbers as the database driver returns them (no client-side digit grouping or rounding)
results_scientific_numeric = Use scientific notation for numbers
results_binary_format = Binary values
results_binary_string = Text
results_binary_hex = Hex
results_binary_base64 = Base64
results_binary_max_length = Binary value length
results_binary_max_length_hint = bytes shown in the grid

types_tab = Connection Types
types_new = New
types_new_name = New type
types_delete = Delete
types_delete_title = Delete Connection Type
types_delete_confirm = Delete the connection type "{0}"? {1} connection(s) use it; they will use "{2}" instead.
types_delete_confirm_unused = Delete the connection type "{0}"?
types_save_failed = The connections of the changed connection types could not be saved.
types_section_type = Connection Type
types_name = Name
types_description = Description
types_color = Color
types_color_dark = Color in the dark theme
types_color_change = Change…
types_color_none = No color
types_section_transactions = Transactions and Execution
types_auto_commit = Auto-commit by default
types_auto_commit_tip = Commit mode of connections that do not set their own. Open sessions switch after OK; uncommitted changes are asked about first.
types_confirm_execute = Confirm SQL execution
types_confirm_execute_tip = Ask before running a statement other than SELECT from a query window
types_confirm_data_change = Confirm data changes
types_confirm_data_change_tip = Show the SQL script before saving changes made in a results grid
types_idle_transactions = Remind me about an idle open transaction
types_idle_transactions_tip = Default of connections that do not set their own. A reminder asks to commit or roll back; it never rolls back on its own.
types_idle_transactions_period = Remind after
types_end_read_only = End read-only transactions automatically after each statement
types_end_read_only_tip = After each statement, when the database confirms that the transaction only read (read locks or a snapshot: PostgreSQL, MySQL, MariaDB), it is ended with a rollback that discards nothing, and the status bar says so. Never with data changes, BEGIN, FOR UPDATE, or when the database cannot tell. Statements then no longer share one snapshot.
types_minutes = minutes
types_section_connections = Connections
types_close_idle = Close idle connections
types_close_idle_tip = Connections of this type that do not set their own period use this period; new connections start with this switch. A connection with an open transaction is not closed.
types_close_idle_period = Close after
types_seconds = seconds
types_section_restrictions = Restrictions

oracle_tab = Oracle
oracle_section_execution = Execution
oracle_section_metadata = Objects
oracle_plan_table = Plan table
oracle_plan_table_hint = empty: PLAN_TABLE or TOAD_PLAN_TABLE; applies after reconnecting
oracle_dbms_output = Show DBMS_OUTPUT in the Messages tab
oracle_dbms_output_tip = Reads DBMS_OUTPUT after every statement. A change also applies to open query windows, from their next statement.
oracle_disable_escape = Disable JDBC escape processing in scripts
oracle_disable_escape_tip = Sends { } sequences in SQL text to the server unchanged
oracle_rowid = Show the ROWID column of tables
oracle_rowid_tip = Tables (except index-organized tables) get a ROWID pseudo column, which identifies rows when editing data without a key
oracle_read_all_synonyms = Read all synonyms
oracle_read_all_synonyms_tip = Also read synonyms of Java classes and package bodies (slower on large databases)
overrides_use_connection = Use different settings for this connection
overrides_hint = Otherwise the settings of Tools > Options apply.
dataformat_tab = Data Formats
dataformat_section = Display formats
dataformat_locale = Locale
dataformat_locale_tip = The locale gives the default number, date and time formats
dataformat_type = Data type
dataformat_sample = Sample
errors_tab = Errors and Timeouts
errors_section_timeouts = Timeouts
errors_ms_hint = milliseconds
errors_open_timeout = Connection open
errors_open_timeout_hint = milliseconds, 0 = until the driver's socket timeout
errors_open_timeout_tip = How long to wait for a new connection. The socket timeout itself is a driver property.
errors_close_timeout = Connection close
errors_close_timeout_tip = How long to wait for a connection to close. The socket timeout itself is a driver property.
errors_validation_timeout = Connection validation
errors_validation_timeout_tip = How long the check whether a connection is still alive may take
errors_section_recovery = Recovery
errors_recover = Reconnect automatically when the connection is lost
errors_recover_tip = Reconnects and runs the operation again after a lost connection or an aborted transaction. If that would discard changes you have not committed, the operation stops with the error instead.
errors_recover_retry = Retry attempts
errors_recover_retry_tip = How many times to reconnect and try again
metadata_tab = Metadata
metadata_section_ddl = Generated DDL
metadata_section_reading = Reading metadata
metadata_case_sensitive = Use case-sensitive names in DDL statements
metadata_case_sensitive_tip = Keeps the case of object names as typed when generating DDL
metadata_extra_ddl_info = Generate DDL with extra information
metadata_extra_ddl_info_tip = Adds extra information to generated object definitions, such as a source comment or a DROP statement
metadata_server_side_filters = Server-side object filters
metadata_server_side_filters_tip = Supported by some databases only: object filters become part of the metadata queries, so only the needed objects are read. Turn off to see linked objects (e.g. from foreign keys). Refresh the Object Explorer to apply.
metadata_expensive_properties = Read expensive object properties (row count, size)
metadata_expensive_properties_tip = Turn off if your database reads row counts or sizes too slowly (e.g. very large tables)
metadata_disable_extra_read = Do not read table information in query windows and result grids
metadata_disable_extra_read_tip = Faster, but auto-complete mostly stops working and query results become read-only
client_tab = Client Identification
client_section_name = Client application name
client_disable = Do not send a client application name
client_disable_tip = The client application name identifies Chromite connections in the server's session list
client_override = Use a custom client application name
client_name = Name
client_name_tip = Variables: {0}, {1} and the connection variables
client_section_parameters = Connection parameters
client_use_variables = Resolve variables in connection parameters
client_use_variables_tip = Replaces ${...} variables (e.g. environment variables) in the connection settings when connecting
results_section_reading = Reading and sorting
results_max_rows_sql = Put the row limit into the SQL text (LIMIT, TOP)
results_max_rows_sql_tip = The database then stops after Maximum rows. Otherwise the whole query runs and reading stops after Maximum rows. Not every database supports it.
results_autofetch = Read more rows when the grid is scrolled to the end
results_order_mode = Column sort
results_order_mode_tip = A sort on the server reads the query again, sorted by the database. A sort in the grid orders the rows already read.
results_order_smart = On the server if not all rows are read
results_order_client = Always in the grid
results_order_server = Always on the server
results_force_subselect = Wrap the query when filtering
results_force_subselect_tip = Puts column filters around the query (SELECT * FROM (query) WHERE ...) instead of into its WHERE clause
results_ignore_label = Show column names instead of labels
results_ignore_label_tip = Column headers show the name of the table column even when the query gives it another label (alias)
results_transform_complex = Show nested values (arrays, structures) as columns
content_tab = Binary and LOB
content_section_reading = Reading
content_cache_clob = Read text LOBs (CLOB) with the row
content_cache_blob = Read binary LOBs (BLOB) with the row
content_cache_tip = Otherwise the value is read when it is shown or edited, while the result is still open
content_cache_max = Read with the row up to
content_bytes_hint = bytes
content_memory_max = Keep in memory up to
content_memory_max_tip = Larger values go to a temporary file. Applies to all connections.
content_encoding = Encoding of binary values as text
content_encoding_tip = Used to convert binary values to text and back (the Text format of Binary values)
conn_tab = Connections
conn_section_security = Security
conn_sanitize = Refuse unsafe driver parameters
conn_sanitize_tip = MySQL and MariaDB connections: the connection is refused when its URL or driver properties turn on loading local files, deserialization or external configuration (for example allowLoadLocalInfile)
conn_win_trust_store = Use the Windows certificate store for SSL
conn_win_trust_store_tip = Trusts the root certificates installed in Windows, for example a company certificate
conn_restart_hint = applies after a restart
conn_section_time = Time zone
conn_timezone = Client time zone
conn_timezone_default = Default (system: {0})
conn_timezone_hint = ClickHouse connections use it when they connect
