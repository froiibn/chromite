# Result grid editing (ResultSetGrid, ResultSetValuePanel, ResultSetViewerPanel, ResultSetPaste, ResultSetDateTimePicker, ResultSetLobFiles, ResultSetCopyFormats)
gridedit_save_commit = 저장하고 커밋
gridedit_save_commit_tip = 변경 내용을 저장하고 열린 트랜잭션을 커밋합니다(수동 커밋 모드)
gridedit_commit_earlier = 열린 트랜잭션에 이 세션에서 먼저 한 변경 {0}개가 있습니다(다른 문장이나 이전 저장).\n저장하고 커밋하면 표의 변경과 함께 커밋됩니다. 계속할까요?
gridedit_committed = 변경 내용을 커밋했습니다.
gridedit_commit_failed = 변경 내용은 열린 트랜잭션에 저장했지만 커밋하지 못했습니다. 쿼리 > 커밋 또는 롤백으로 트랜잭션을 끝내세요.
