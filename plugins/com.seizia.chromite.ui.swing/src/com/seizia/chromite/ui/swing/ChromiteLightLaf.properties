# Chromite light theme (SSMS-like). Loaded by FlatLaf for ChromiteLightLaf on top of FlatLightLaf.properties.
# Only colors are customized; no third-party theme files or icons are used.

# Fixed blue accent instead of the operating system accent color
@accentColor = #0078d4
# Light gray chrome around white content areas (tree, tables, editors)
@background = #f3f3f3
