scheduler_event_status_disabled = The event scheduler is DISABLED: it was turned off when the server started (event_scheduler=DISABLED). Change the server configuration file and restart the server to use events.
scheduler_event_status_unknown = The event scheduler state could not be read.
scheduler_event_no_history = MySQL and MariaDB keep no run history for events: only the last execution time (LAST_EXECUTED) is recorded.
