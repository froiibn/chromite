# Approval of code from connection settings (ExecutionApprovalDialog)
approval_connection = Connection
approval_url = URL
approval_allow = Allow
approval_allow_connect = Allow and Connect
approval_cancel_note = Cancel stops the connection. Nothing runs.
init_approval_title = Run initialization SQL?
init_approval_message = Connecting runs the initialization SQL below, from the connection settings (INIT= in the URL or the connection's bootstrap queries). It runs before anything else and can read and write files and reach the network. Allow it only if you know and trust it.
init_approval_script = SQL
init_approval_remember_note = Allow remembers this SQL for this connection and URL. If either changes, you are asked again.
sqlite_ext_title = Load SQLite native extensions?
sqlite_ext_message = This SQLite connection loads native extensions (enable_load_extension). They run as code inside Chromite with your rights. Allow them only if you know and trust them.
sqlite_ext_libraries = Libraries
sqlite_ext_queries = Initialization SQL
sqlite_ext_remember_note = Allow remembers these settings for this connection. If they change, you are asked again.

# Disconnecting several connections, Invalidate/Reconnect (ConnectionCommands, ExitTransactionCheck)
disconnect_others = Disconnect Others
disconnect_all = Disconnect All
disconnect_group = Disconnect
disconnect_many_txn_message = These connections have transactions that are not committed:\n{0}\n\nDisconnecting ends them. Commit or roll back first? Cancel keeps all connections and their transactions.
invalidate = Invalidate/Reconnect
invalidate_tip = Reopen the sessions of the server without disconnecting it (query windows keep their place)
reconnect_txn_message = These sessions have transactions that are not committed:\n{0}\n\nReopening the sessions ends them. Commit or roll back first? Cancel keeps the sessions and their transactions.
reconnect_txn_error = The transaction of {0} could not be ended. The sessions are not reopened.

# Connection lost and driver errors (DatabaseErrorDialogs)
lost_title = Connection lost: {0}
lost_message = The connection to {0} was lost. Reconnect reopens its sessions; uncommitted transactions are asked about first.
lost_reconnect_failed_message = The connection to {0} was lost and could not be reopened. Disconnect it (open transactions are asked about first), try again, or close this message and leave it as it is.
lost_reconnect = Reconnect
lost_disconnect = Disconnect
lost_retry = Retry
driver_config_title = Driver error
driver_config_message = The driver class of {0} was not found: the class name or the driver files are wrong. Check them in the driver settings.
driver_config_edit = Edit Driver…
driver_license_title = Connection error
driver_license_message = The driver license for {0} is not active.

# Running jobs at exit (RunningJobsCheck)
exit_jobs_title = Jobs Still Running
exit_jobs_message = These jobs are still running:\n{0}\n\nWait until they finish and then close Chromite, or stop them and close it now? Cancel keeps Chromite open and the jobs running.
exit_jobs_more = …and {0} more
exit_jobs_tasks = Database tasks
exit_jobs_wait = Wait and Exit
exit_jobs_stop = Stop and Exit
exit_jobs_waiting = Waiting for running jobs
exit_jobs_stopping = Stopping running jobs

# Smart commit (ConnectionTypesPage, SmartCommit)
smart_commit = Smart commit: switch to manual commit for statements that change data
smart_commit_tip = On an auto-commit connection, a query window statement that changes data switches its session to manual commit, so that the change can still be rolled back.
smart_commit_recover = Return to auto-commit after commit or rollback
smart_commit_recover_tip = After you commit or roll back, the session goes back to auto-commit. A session that has a new open transaction by then waits for its end.

# Query > Auto-Commit and the SQL Editor tool bar's commit mode button (CommitModeSwitch)
commit_mode_auto = Auto-Commit
commit_mode_manual = Manual Commit
commit_mode_unknown = Commit Mode
commit_mode_tip_auto = The active query window's session commits each statement when it completes. Click to switch the session to manual commit.
commit_mode_tip_manual = The active query window's session keeps changes in a transaction until you commit. Click to switch the session to auto-commit (you are asked about an open transaction first).
commit_mode_tip_shared = The session is shared with the other query windows of the connection, so the change applies to them too.
commit_mode_tip_unavailable = Switches the active query window's session between auto-commit and manual commit. Available while the window is connected and nothing runs in it.
commit_mode_title = Commit Mode
commit_mode_txn_message = The session of {0} on {1} has a transaction that is not committed.\nThe driver commits an open transaction when the session switches to auto-commit, so end it first.
commit_mode_txn_cancel_note = Cancel keeps the session in manual commit with its transaction open.
commit_mode_commit_switch = Commit and Switch
commit_mode_rollback_switch = Roll Back and Switch
commit_mode_shared_note = The query windows of {0} share one session ({1}): the commit mode changes for all of them.
commit_mode_switch_to = Switch to {0}
commit_mode_progress = Switching the commit mode
commit_mode_running = A statement is running in the session. Nothing was changed; switch the commit mode when it has finished.
commit_mode_changed = The session's transaction changed after you were asked (another statement ran in it). Nothing was committed, rolled back or switched; try again.
commit_mode_error = Could not switch the commit mode of {0} on {1}. The status line shows the session''s mode now.

