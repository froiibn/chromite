txn_log_show_previous = Show previous transactions
txn_log_show_previous_tip = Also the statements of the session's last transactions since it connected, and how each transaction ended
txn_log_col_transaction = Transaction
txn_log_open = Open
txn_log_committed = Committed {0}
txn_log_rolled_back = Rolled back {0}
