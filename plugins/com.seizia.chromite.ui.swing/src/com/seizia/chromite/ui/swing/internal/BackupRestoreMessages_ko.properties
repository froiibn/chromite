native_pg_all_no_owner = 소유권 설정 명령 쓰지 않음(--no-owner)
native_pg_all_role_passwords = 역할 암호 포함(끄면 --no-role-passwords)
native_pg_all_note = pg_dumpall 옵션입니다. 백업은 일반 SQL 스크립트이며, 복원 대화상자에서 일반(SQL 스크립트) 형식으로 복원합니다(psql 실행).
native_pg_globals_success = 서버의 전역 개체를 백업했습니다.
native_pg_cluster_success = 클러스터를 백업했습니다.
native_mysql_compress = 클라이언트·서버 통신 압축(--compress)
native_section_account = 도구 계정
native_tool_user = 사용자 이름:
native_tool_password = 암호:
native_tool_account_note = 비워 두면 연결의 사용자로 도구를 실행합니다. 암호는 명령줄이 아니라 환경 변수 {0}(으)로 도구에 넘기며, 작업에 저장하지 않습니다. 도구 계정이 있는 저장된 작업에는 Chromite가 암호를 넘기지 않으므로, 클라이언트가 자체 암호 파일(pgpass.conf, MySQL 옵션 파일 등)을 읽거나 로그인에 실패합니다.
native_extra_args = 추가 인수:
native_extra_args_note = 입력한 그대로 공백으로 나눠 명령줄에 붙입니다(인수에 공백을 넣을 수 없음). 암호를 넣지 마십시오. 이 컴퓨터의 다른 프로그램이 명령줄을 볼 수 있습니다.
