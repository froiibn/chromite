drivers_section_maven = Maven 저장소
drivers_maven_enabled = 사용
drivers_maven_name = 이름
drivers_maven_url = URL
drivers_maven_type = 출처
drivers_maven_type_global = 기본 제공
drivers_maven_type_custom = 추가함
drivers_maven_add = 추가
drivers_maven_edit = 편집
drivers_maven_remove = 제거
drivers_maven_dialog_add = Maven 저장소 추가
drivers_maven_dialog_edit = Maven 저장소 편집
drivers_maven_id = ID
drivers_maven_snapshot = 스냅숏 저장소
drivers_maven_scopes = 그룹
drivers_maven_scopes_hint = 쉼표로 나눈 그룹 ID, 비우면 모두
