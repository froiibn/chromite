exec_tab = 쿼리 실행
exec_default_hint = 기본값 {0}
exec_section_delimiters = 문 구분 기호
exec_delimiter = 문 구분 기호
exec_delimiter_hint = 기본값 {0}, 데이터베이스 자체 구분 기호도 씀
exec_delimiter_tip = 스크립트에서 문의 끝을 나타내는 글자입니다. 여러 개는 공백으로 구분합니다.
exec_ignore_native_delimiter = 데이터베이스 자체 구분 기호 무시
exec_ignore_native_delimiter_tip = 스크립트를 위의 문 구분 기호에서만 나누고 데이터베이스의 구분 기호(예: GO)에서는 나누지 않습니다.
exec_blank_line = 빈 줄로 문 끝내기
exec_blank_line_tip = 자동: 앞의 문이 완성되었으면 빈 줄에서 문을 끝냅니다(실행한 스크립트에서도). 항상: 커서 위치의 문(코드 완성)은 빈 줄에서 끝나지만, 스크립트는 구분 기호에서만 나눕니다. 사용 안 함: 구분 기호에서만 문을 끝냅니다.
exec_blank_line_smart = 자동
exec_blank_line_always = 항상
exec_blank_line_never = 사용 안 함
exec_remove_trailing_delimiter = 보내기 전에 문 끝의 구분 기호 제거
exec_remove_trailing_delimiter_tip = 일부 드라이버는 구분 기호로 끝나는 문을 거부합니다.
exec_section_parameters = 매개 변수
exec_parameters_enabled = 이름 있는 매개 변수(:name)
exec_named_prefix = 이름 있는 매개 변수 접두사
exec_anonymous_parameters = 이름 없는 매개 변수(?)
exec_anonymous_mark = 이름 없는 매개 변수 기호
exec_parameters_in_embedded_code = 코드 블록 안의 매개 변수
exec_parameters_in_embedded_code_tip = DDL 문과 $$ … $$ 같은 코드 블록 안에서도 매개 변수를 찾습니다.
exec_variables_enabled = 변수(${name}, @set)
exec_command_prefix = 명령 접두사
exec_command_prefix_tip = 이 접두사로 시작하는 줄은 SQL이 아니라 클라이언트 명령(예: @set)입니다.
exec_section_errors = 오류
exec_on_error = 오류가 나면
exec_on_error_hint = 어느 쪽이든 열린 트랜잭션은 그대로 둡니다
exec_on_error_stop = 스크립트 중지
exec_on_error_ignore = 그 문을 건너뛰고 계속
exec_section_sessions = 세션
exec_separate_connection = 쿼리 창 세션
exec_separate_connection_hint = 바꾼 뒤 연결하는 쿼리 창부터 적용
exec_separate_connection_tip = 쿼리 창마다 세션을 따로 쓰면 트랜잭션도 창마다 따로입니다. 한 창의 커밋이 다른 창의 변경을 커밋하지 않습니다. 연결마다 연결 속성에서 바꿀 수 있습니다.
exec_separate_connection_default = 쿼리 창마다 세션(내장 DB와 단일 연결 DB 제외)
exec_separate_connection_always = 항상 쿼리 창마다 세션
exec_separate_connection_never = 한 연결의 쿼리 창들이 한 세션을 함께 씀

results_use_fetch_size = JDBC 가져오기 크기 사용
results_use_fetch_size_tip = 드라이버가 행을 나누어 읽게 합니다. 일부 드라이버(예: PostgreSQL)는 이 설정이 없으면 첫 행을 보이기 전에 결과 전체를 읽습니다.
results_native_numeric = 숫자를 데이터베이스 형식으로 표시
results_native_numeric_tip = 데이터베이스 드라이버가 돌려준 숫자를 그대로 보입니다(클라이언트에서 자릿수 구분이나 반올림을 하지 않음).
results_scientific_numeric = 숫자에 과학적 표기법 사용
results_binary_format = 이진 값
results_binary_string = 텍스트
results_binary_hex = 16진수
results_binary_base64 = Base64
results_binary_max_length = 이진 값 길이
results_binary_max_length_hint = 결과 표에 보이는 바이트 수

types_tab = 연결 유형
types_new = 새로 만들기
types_new_name = 새 유형
types_delete = 삭제
types_delete_title = 연결 유형 삭제
types_delete_confirm = 연결 유형 "{0}"을(를) 삭제하시겠습니까? 이 유형을 쓰는 연결 {1}개는 "{2}" 유형으로 바뀝니다.
types_delete_confirm_unused = 연결 유형 "{0}"을(를) 삭제하시겠습니까?
types_save_failed = 바뀐 연결 유형을 쓰는 연결을 저장하지 못했습니다.
types_section_type = 연결 유형
types_name = 이름
types_description = 설명
types_color = 색
types_color_dark = 다크 테마 색
types_color_change = 변경
types_color_none = 색 없음
types_section_transactions = 트랜잭션과 실행
types_auto_commit = 기본으로 자동 커밋
types_auto_commit_tip = 자체 값을 정하지 않은 연결의 커밋 방식입니다. 열린 세션은 확인을 누르면 바뀌고, 커밋하지 않은 변경이 있으면 먼저 묻습니다.
types_confirm_execute = SQL 실행 확인
types_confirm_execute_tip = 쿼리 창에서 SELECT가 아닌 문을 실행하기 전에 묻습니다.
types_confirm_data_change = 데이터 변경 확인
types_confirm_data_change_tip = 결과 표의 변경 내용을 저장하기 전에 SQL 스크립트를 보여 줍니다.
types_idle_transactions = 유휴 상태로 열려 있는 트랜잭션 알림
types_idle_transactions_tip = 자체 값을 정하지 않은 연결의 기본값입니다. 알림은 커밋하거나 롤백할지 묻고, 스스로 롤백하지 않습니다.
types_idle_transactions_period = 알림 시간
types_end_read_only = 조회만 한 트랜잭션은 문장이 끝나면 자동으로 끝내기
types_end_read_only_tip = 문장이 끝날 때마다 DB가 조회만 한 트랜잭션(읽기 잠금·스냅숏만: PostgreSQL, MySQL, MariaDB)이라고 확인하면 버리는 것이 없는 롤백으로 끝내고 상태 표시줄에 알립니다. 데이터 변경, BEGIN, FOR UPDATE가 있거나 DB에서 확인할 수 없으면 하지 않습니다. 문장들이 한 스냅숏을 함께 쓰지 않게 됩니다.
types_minutes = 분
types_section_connections = 연결
types_close_idle = 유휴 연결 닫기
types_close_idle_tip = 자체 시간을 정하지 않은 이 유형의 연결은 이 시간을 씁니다. 새 연결은 이 설정대로 켜지거나 꺼집니다. 열린 트랜잭션이 있는 연결은 닫지 않습니다.
types_close_idle_period = 닫는 시간
types_seconds = 초
types_section_restrictions = 제한

oracle_tab = Oracle
oracle_section_execution = 실행
oracle_section_metadata = 개체
oracle_plan_table = 실행 계획 테이블
oracle_plan_table_hint = 비우면 PLAN_TABLE 또는 TOAD_PLAN_TABLE, 다시 연결한 뒤 적용
oracle_dbms_output = 메시지 탭에 DBMS_OUTPUT 표시
oracle_dbms_output_tip = 문장마다 DBMS_OUTPUT을 읽습니다. 바꾸면 열린 쿼리 창에도 다음 문장부터 적용됩니다.
oracle_disable_escape = 스크립트의 JDBC 이스케이프 처리 끄기
oracle_disable_escape_tip = SQL 텍스트의 { } 시퀀스를 바꾸지 않고 서버로 보냅니다.
