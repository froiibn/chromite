tasks_schedule_confirm = ''{0}'' 작업은 실행할 때마다 다음을 묻습니다.\n일정을 켜면 예약 실행은 묻지 않고 진행합니다:\n\n{1}
tasks_schedule_confirm_button = 켜기
tasks_schedule_reading = ''{0}'' 작업의 명령 읽는 중
tasks_schedule_left_open = 예약 실행이 ''{0}'' 연결의 세션에 트랜잭션을 열어 둔 채 끝났습니다(스크립트가 시작하고 끝내지 않음). 커밋도 롤백도 하지 않았습니다. 도구 > 열린 트랜잭션에서 정하십시오.
