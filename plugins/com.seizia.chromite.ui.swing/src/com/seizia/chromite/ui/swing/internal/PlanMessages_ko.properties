# View switch (ExecutionPlanView)
plan_view_graphical = 그래픽
plan_view_graphical_tip = 연산자를 그림으로 표시합니다(데이터는 오른쪽에서 왼쪽으로 흐름)
plan_view_tree = 트리
plan_view_tree_tip = 연산자를 속성과 함께 트리로 표시합니다
plan_view_raw = 원본
plan_view_raw_tip = 서버가 반환한 그대로의 계획

# Graphical plan (PlanDiagramView, PlanDiagramBuilder)
plan_zoom_in = 확대(Ctrl+휠)
plan_zoom_out = 축소(Ctrl+휠)
plan_zoom_fit = 창에 맞추기
plan_zoom_actual = 실제 크기
plan_query = 쿼리 {0}
plan_query_cost = 쿼리 {0}: 쿼리 비용(일괄 처리 기준): {1}
plan_no_plan = 계획 없음: {0}
plan_missing_index = 누락 인덱스(영향 {0}): {1}
plan_cost = 비용: {0}
plan_rows = {0}행
plan_rows_actual = {0} / 예상 {1} ({2})
plan_arrow_rows_estimated = 예상 행 수: {0}
plan_arrow_rows_actual = 실제 행 수: {0}(예상 {1})
plan_tip_operation = 연산
plan_tip_logical_operation = 논리 연산
plan_tip_object = 개체
plan_tip_cost = 연산자 비용
plan_tip_subtree_cost = 하위 트리 비용
plan_tip_estimated_rows = 예상 행 수(모든 실행)
plan_tip_actual_rows = 실제 행 수
plan_tip_executions = 실행 횟수
plan_tip_time = 시간
plan_tip_condition = 조건자
plan_tip_warnings = 경고
plan_misestimate = 예상이 {0}배 어긋났습니다
plan_warning_implicit_conversion = 암시적 변환이 계획에 영향을 줄 수 있습니다
plan_warning_spill = 데이터가 디스크로 넘쳤습니다
plan_warning_no_join_predicate = 조인 조건자 없음
plan_warning_no_statistics = 통계가 없는 열
plan_warning_memory_grant = 메모리 부여 경고
plan_warning_missing_index = 누락 인덱스
plan_warning_other = 경고

# Raw plan (PlanRawView)
plan_raw_copy = 복사
plan_raw_copy_tip = 계획 텍스트 복사
plan_raw_save = 다른 이름으로 저장…
plan_raw_save_tip = 계획 텍스트를 파일로 저장
plan_raw_save_failed = 파일을 저장하지 못했습니다.
plan_raw_none = 서버가 이 문의 계획 텍스트를 반환하지 않았습니다.
plan_raw_query = 쿼리 {0}
plan_raw_queries = 쿼리 {0}-{1}
plan_filter_sqlplan = 실행 계획(*.sqlplan)
plan_filter_xml = XML 파일(*.xml)
plan_filter_json = JSON 파일(*.json)
plan_filter_text = 텍스트 파일(*.txt)
