meta.com.seizia.chromite.ext.postgresql.model.impls.redshift.RedshiftTableColumn.sortKey.description = Ordem da coluna na chave de ordenação.\nSe a tabela usar uma chave de ordenação composta, todas as colunas que fazem parte da chave de ordenação terão um valor positivo que indica a posição da coluna na chave de ordenação.\nSe a tabela usar uma chave de ordenação intercalada, todas as colunas que fazem parte da chave de ordenação têm um valor alternadamente positivo ou negativo, em que o valor absoluto indica a posição da coluna na chave de ordenação. \nSe 0, a coluna não faz parte de uma chave de ordenação.
