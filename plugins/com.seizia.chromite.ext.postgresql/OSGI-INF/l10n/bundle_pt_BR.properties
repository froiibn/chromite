meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normalmente o VACUUM ignora páginas baseadas no mapeamento de visibilidade.\r\nPáginas nas quais sabe-se que todos os tuples estão em freeze podem ser ignoradas, e aquelas em que sabe-se que todos os tuples são visíveis para todas as transações podem ser ignoradas, exceto ao realizar um vacuum agressivo.\r\nAlém disso, exceto quando realizar um vacuum agressivo, algumas páginas podem ser ignoradas com o intuito de evitar esperar que outras sessões terminem de utilizá-las.\r\nEsta opção desativa todo o comportamento de omissão de páginas e deve ser usado apenas quando achar que o conteúdo do mapeamento de visibilidade está suspeito, o que deve ocorrer apenas se houver uma falha de hardware ou software causando corrupção do banco de dados.\r\nCompatível desde o PostgreSQL 9.6.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Desativar omissão de página
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Opta "freezing" agressivo de tuples. Especificar FREEZE é equivalente a efetuar VACUUM com os parâmetros vacuum_freeze_min_age e vacuum_freeze_table_age definidos com zero.\r\nFreezing agressivo é efetuado sempre quando a tabela é reescrita, então esta opção é redundante quando FULL é especificado.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Freeze
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Opta pelo vacuum "full", o que pode reivindicar mais espaço, mas leva muito mais tempo e trava tabelas exclusivamente.\r\nEste método também requer espaço em disco adicional, já que escreve uma nova cópia da tabela e não libera a cópia antiga até que a operação tenha terminado.\r\nIsto só deve ser usado quando uma quantidade significativa de espaço precisa ser reivindicada da tabela.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Full
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Especifica que o VACUUM deve tentar remover entradas de índice que apontam para tuples prescritos.\r\n Normalmente este é o comportamento desejado e será o padrão, a menos que a opção vacuum_index_cleanup\r\n seja definida como falsa para a tabela processada pelo vacuum. Definindo esta opção como falso\r\n pode ser útil quando for necessário executar o vacuum o mais rápido possível, por exemplo, para\r\n evitar wraparound em ID de transação iminentes.\r\n Porém, se a limpeza de índice não for efetuada regularmente, a performance pode ser afetada, pois\r\n enquanto a tabela é modificada os índices irão acumular tuples prescritos e a tabela irá acumular\r\n ponteiros para linhas mortas que não podem ser removidos até que a limpeza de índice tenha terminado.\r\n Esta opção não terá efeito para tabelas que não tenham um índice e é ignorada se a opção FULL\r\n for utilizada.\r\nCompatível desde o PostgreSQL 12.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Limpeza de índices
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Especifica que o VACUUM não deve aguardar que quaisquer locks conflitantes sejam liberados ao começar\r\na processar uma relação:\r\n se uma relação não puder ser travada imediatamente sem que seja necessário esperar, a relação é ignorada.\r\n Perceba que mesmo com esta opção, o VACUUM ainda pode bloquear ao abrir os índices de relações.\r\n Além disso, o VACUUM ANALYZE ainda pode bloquear ao adquirir amostras de linhas de partições, filhos\r\n de heranças de tabelas e alguns tipos de tabelas estrangeiras.\r\n Também, ainda que o VACUUM habitualmente processe todas as partições de todas as tabelas particionadas,\r\n esta opção fará com que o VACUUM ignore todas as partições se houver uma trava conflitante na tabela\r\n particionada.\r\nCompatível desde o PostgreSQL 12.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Ignorar travados
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Especifica que o VACUUM deve tentar truncar qualquer página vazia no final da tabela e permitir\r\n que espaço em disco para páginas truncadas sejam devolvidas ao sistema operacional.\r\n Isto normalmente é o comportamento esperado e é o padrão, a menos que a opção vacuum_truncate\r\n seja definida como falso para a tabela processada pelo vacuum. Definindo esta opção como falso\r\n pode ser útil para evitar travas ACCESS EXCLUSIVE na tabela que for necessário truncar.\r\n Esta opção é ignorada se a opção FULL for utilizada.\r\nCompatível desde o PostgreSQL 12.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Truncate
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = Se WITH DATA for especificado (ou por padrão) a consulta de apoio é executada para fornecer novos dados e a view materializada é deixada em um estado escaneável.\r\nSe WITH NO DATA for especificado, nenhum dado novo é gerado e a view materializada é deixada em um estado não-escaneável.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.name = With data
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = Truncar automaticamente todas as tabelas que possuam referências de chaves\r\n estrangeiras para quaisquer tabelas nomeadas, ou para qualquer tabela adicionada\r\n ao grupo devido a CASCADE.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = Cascade
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = Se ONLY não for especificado, a tabela e todas suas tabelas descendentes (se exisitirem) serão truncadas.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = Only
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = Reinicia automaticamente sequências pertencentes a colunas da tabela(s) truncada(s).
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.name = Reiniciar identidade
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = Executar feramenta em uma transação separada. Executar commit na transação ativa antes da execução da ferramenta e commit após execução bem-sucedida da ferramenta
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.name = Executar em transação separada
