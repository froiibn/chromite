tasks.vacuum.table.node.name = Vacuum table
tasks.vacuum.table.node.description = Vacuum table(s)
tasks.vacuum.database.node.name = Vacuum database
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Full
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Selects "full" vacuum, which can reclaim more space, but takes much longer and exclusively locks the table.\nThis method also requires extra disk space, since it writes a new copy of the table and does not release the old copy until the operation is complete.\nThis should only be used when a significant amount of space needs to be reclaimed from within the table.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Freeze
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Selects aggressive "freezing" of tuples. Specifying FREEZE is equivalent to performing VACUUM with the vacuum_freeze_min_age and vacuum_freeze_table_age parameters set to zero.\nAggressive freezing is always performed when the table is rewritten, so this option is redundant when FULL is specified.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analyzed
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Updates statistics used by the planner to determine the most efficient way to execute a query.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Disable page skipping
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normally, VACUUM will skip pages based on the visibility map.\nPages where all tuples are known to be frozen can always be skipped, and those where all tuples are known to be visible to all transactions may be skipped except when performing an aggressive vacuum.\nFurthermore, except when performing an aggressive vacuum, some pages may be skipped in order to avoid waiting for other sessions to finish using them.\nThis option disables all page-skipping behavior, and is intended to be used only the contents of the visibility map are thought to be suspect, which should happen only if there is a hardware or software issue causing database corruption.\nWorks since PostgreSQL 9.6.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Index cleanup
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Specifies that VACUUM should attempt to remove index entries pointing to dead tuples.\n This is normally the desired behavior and is the default unless the vacuum_index_cleanup option\n has been set to false\n for the table to be vacuumed. Setting this option to false may be useful when it is necessary\n to make vacuum run as quickly as possible, for example to avoid imminent transaction ID wraparound.\n However, if index cleanup is not performed regularly, performance may suffer, because as the table is modified,\n indexes will accumulate dead tuples and the table itself will\n accumulate dead line pointers that cannot be removed until index cleanup is completed.\n This option has no effect for tables that do not have an index and is ignored if the FULL option is used.\nWorks since PostgreSQL 12.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Truncate
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Specifies that VACUUM should attempt to truncate off any empty pages at the end of the table\n and allow the disk space for the truncated pages to be returned to the operating system.\n This is normally the desired behavior and is the default unless the vacuum_truncate option\n has been set to false for the table to be vacuumed. Setting this option to false\n may be useful to avoid ACCESS EXCLUSIVE lock on the table that the truncation requires.\n This option is ignored if the FULL option is used.\nWorks since PostgreSQL 12.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Skip locked
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Specifies that VACUUM should not wait for any conflicting locks to be released when beginning work on a relation:\n if a relation cannot be locked immediately without waiting, the relation is skipped.\n Note that even with this option, VACUUM may still block when opening the relation's indexes.\n Additionally, VACUUM ANALYZE may still block when acquiring sample rows from partitions, table inheritance children, and some types of foreign tables.\n Also, while VACUUM ordinarily processes all partitions of specified partitioned tables,\n this option will cause VACUUM to skip all partitions if there is a conflicting lock on the partitioned table.\nWorks since PostgreSQL 12.
