meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.name = Mit Daten
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = Wenn "Mit Daten" angegeben ist (oder Standardwerte), wird die Sicherungsabfrage ausgeführt, um die neuen Daten bereitzustellen, und die materialisierte Ansicht wird in einem scanbaren Zustand belassen.\r\nWenn "Mit keinen Daten" angegeben wird, werden keine neuen Daten erzeugt und die materialisierte Ansicht wird in einem nicht scanbaren Zustand belassen.

