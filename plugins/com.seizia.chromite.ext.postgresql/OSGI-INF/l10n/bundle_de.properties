meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.name = In einer separaten Transaktion ausführen
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = Tool in einer separaten Transaktion ausführen. Bestätigen der aktiven Transaktion\n vor der Werkzeugausführung und bestätigen nach erfolgreicher Werkzeugausführung
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.name = Identität neu starten
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = Startet automatisch Sequenzen neu, die zu den Spalten der abgeschnittenen Tabelle(n) gehören.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = Kaskade
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = Automatisches Abschneiden aller Tabellen, die Fremdschlüsselreferenzen auf eine der genannten Tabellen\n oder auf Tabellen haben, die aufgrund von CASCADE zur Gruppe hinzugefügt wurden.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = Nur
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = Wenn "Nur" nicht angegeben ist, werden die Tabelle und alle ihre Nachfolgetabellen (falls vorhanden) abgeschnitten.

# tool vacuum #
tasks.vacuum.table.node.name = Vacuum Tabelle
tasks.vacuum.table.node.description = Vacuum Tabelle(n)
tasks.vacuum.database.node.name = Vacuum Datenbank
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Volles
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Wählt "volles" Vakuum, das mehr Speicherplatz zurückgewinnen kann, aber viel länger dauert und die Tabelle exklusiv sperrt.\r\nDiese Methode benötigt auch zusätzlichen Festplattenspeicher, da bei dieser Methode eine neue Kopie der Tabelle erstellt wird und die alte Kopie erst nach Abschluss des Vorgangs freigegeben wird.\r\nNormalerweise sollte dies nur dann verwendet werden, wenn ein erheblicher Teil des Platzes innerhalb der Tabelle zurückgewonnen werden muss.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Einfrieren
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Wählt das aggressive "Einfrieren" von Tupeln. Die Angabe von FREEZE entspricht der Durchführung von VACUUM, wobei die Parameter vacuum_freeze_min_age und vacuum_freeze_table_age auf Null gesetzt sind.\r\nDas aggressive Einfrieren wird immer beim Neuschreiben der Tabelle durchgeführt, so dass diese Option bei Angabe von FULL redundant ist.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analysiert
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Aktualisiert die Statistiken, die vom Planer verwendet werden, um die effizienteste Art der Ausführung einer Abfrage zu bestimmen.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Disable page skipping
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normalerweise überspringt VACUUM Seiten, die auf der Sichtbarkeitskarte basieren.\r\nSeiten, bei denen bekannt ist, dass alle Tupel eingefroren sind, können immer übersprungen werden, und solche, bei denen bekannt ist, dass alle Tupel für alle Transaktionen sichtbar sind, können übersprungen werden, außer wenn ein aggressives Vakuum durchgeführt wird.\r\nDarüber hinaäöpus können, außer bei der Durchführung eines aggressiven Vakuums, einige Seiten übersprungen werden, um nicht darauf zu warten, dass andere Sitzungen ihre Verwendung beenden.\r\nDiese Option deaktiviert das gesamte Verhalten beim Überspringen von Seiten und ist dafür vorgesehen, nur den Inhalt der Sichtbarkeitskarte als verdächtig zu betrachten, was nur geschehen sollte, wenn es ein Hardware- oder Softwareproblem gibt, das zu einer Beschädigung der Datenbank führt.
