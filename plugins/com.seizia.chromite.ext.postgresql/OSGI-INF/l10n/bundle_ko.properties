meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = WITH DATA를 지정하거나 기본값을 사용하면 기반 쿼리를 실행해 새 데이터를 채우고, 구체화된 뷰는 스캔 가능한 상태가 됩니다.\nWITH NO DATA를 지정하면 새 데이터를 생성하지 않고, 구체화된 뷰는 스캔할 수 없는 상태가 됩니다.

