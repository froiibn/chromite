meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = 별도 트랜잭션에서 도구를 실행합니다. 도구를 실행하기 전에 활성 트랜잭션을 커밋하고, 도구가 성공하면 커밋합니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.name = ID 다시 시작
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = 비우는 테이블의 열이 소유한 시퀀스를 자동으로 다시 시작합니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = 계단식
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = 지정한 테이블 또는 CASCADE로 인해 추가된 테이블을 외래 키로 참조하는\n 모든 테이블을 자동으로 비웁니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = 지정한 테이블만
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = ONLY를 지정하지 않으면 테이블과 모든 하위 테이블(있는 경우)을 비웁니다.

# tool vacuum #
tasks.vacuum.table.node.name = 테이블 VACUUM
tasks.vacuum.table.node.description = 테이블 VACUUM
tasks.vacuum.database.node.name = 데이터베이스 VACUUM
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = 전체(FULL)
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = "FULL" VACUUM을 선택합니다. 더 많은 공간을 회수할 수 있지만 훨씬 오래 걸리고 테이블을 단독으로 잠급니다.\n테이블의 새 복사본을 기록하고 작업이 끝날 때까지 이전 복사본을 해제하지 않으므로 추가 디스크 공간도 필요합니다.\n테이블에서 상당한 공간을 회수해야 할 때만 사용하십시오.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = 동결(FREEZE)
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = 튜플을 적극적으로 "동결"합니다. FREEZE를 지정하는 것은 vacuum_freeze_min_age와 vacuum_freeze_table_age 매개 변수를 0으로 설정하고 VACUUM을 실행하는 것과 같습니다.\n테이블을 다시 쓸 때는 항상 적극적 동결을 수행하므로 FULL을 지정하면 이 옵션은 필요하지 않습니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = 분석(ANALYZE)
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = 플래너가 쿼리를 가장 효율적으로 실행할 방법을 결정하는 데 쓰는 통계를 업데이트합니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = 페이지 건너뛰기 사용 안 함
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = 일반적으로 VACUUM은 가시성 맵을 기준으로 페이지를 건너뜁니다.\n모든 튜플이 동결된 것으로 알려진 페이지는 항상 건너뛸 수 있고, 모든 튜플이 모든 트랜잭션에 보이는 것으로 알려진 페이지는 적극적 VACUUM이 아닐 때 건너뛸 수 있습니다.\n또한 적극적 VACUUM이 아닐 때는 다른 세션이 페이지 사용을 마칠 때까지 기다리지 않도록 일부 페이지를 건너뛸 수 있습니다.\n이 옵션은 모든 페이지 건너뛰기를 사용하지 않으며, 가시성 맵의 내용이 의심스러울 때만 사용해야 합니다. 이는 하드웨어나 소프트웨어 문제로 데이터베이스가 손상된 경우에만 발생합니다.\nPostgreSQL 9.6부터 사용할 수 있습니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = 인덱스 정리
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = VACUUM이 비활성 튜플을 가리키는 인덱스 항목을 제거하도록 지정합니다.\n 일반적으로 원하는 동작이며, 대상 테이블의 vacuum_index_cleanup 옵션이\n false로 설정되지 않았다면\n 기본값입니다. VACUUM을 최대한 빨리 실행해야 할 때(예: 임박한 트랜잭션 ID 랩어라운드를 피할 때)\n 이 옵션을 false로 설정하면 유용할 수 있습니다.\n 그러나 인덱스 정리를 정기적으로 수행하지 않으면 테이블이 수정됨에 따라\n 인덱스에 비활성 튜플이 쌓이고 테이블 자체에도 인덱스 정리가 끝날 때까지\n 제거할 수 없는 비활성 줄 포인터가 쌓여 성능이 저하될 수 있습니다.\n 인덱스가 없는 테이블에는 효과가 없으며 FULL 옵션을 사용하면 무시됩니다.\nPostgreSQL 12부터 사용할 수 있습니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = 끝 페이지 잘라내기(TRUNCATE)
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = VACUUM이 테이블 끝의 빈 페이지를 잘라내고\n 잘라낸 페이지의 디스크 공간을 운영 체제에 반환하도록 지정합니다.\n 일반적으로 원하는 동작이며, 대상 테이블의 vacuum_truncate 옵션이\n false로 설정되지 않았다면 기본값입니다. 이 옵션을 false로 설정하면\n 잘라내기에 필요한 테이블의 ACCESS EXCLUSIVE 잠금을 피할 수 있습니다.\n FULL 옵션을 사용하면 이 옵션은 무시됩니다.\nPostgreSQL 12부터 사용할 수 있습니다.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = 잠긴 릴레이션 건너뛰기
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = VACUUM이 릴레이션 작업을 시작할 때 충돌하는 잠금이 해제되기를 기다리지 않도록 지정합니다.\n 릴레이션을 기다리지 않고 즉시 잠글 수 없으면 해당 릴레이션을 건너뜁니다.\n 이 옵션을 사용해도 릴레이션의 인덱스를 열 때는 VACUUM이 차단될 수 있습니다.\n 또한 VACUUM ANALYZE는 파티션, 테이블 상속 자식, 일부 외부 테이블에서 샘플 행을 가져올 때 차단될 수 있습니다.\n 그리고 VACUUM은 보통 지정한 파티션 테이블의 모든 파티션을 처리하지만,\n 이 옵션을 사용하면 파티션 테이블에 충돌하는 잠금이 있을 때 모든 파티션을 건너뜁니다.\nPostgreSQL 12부터 사용할 수 있습니다.
