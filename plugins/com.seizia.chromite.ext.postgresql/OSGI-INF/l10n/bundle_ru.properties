meta.com.seizia.chromite.ext.postgresql.model.impls.redshift.RedshiftTableColumn.sortKey.description = Порядок столбца в ключе сортировки.\r\nЕсли в таблице используется составной ключ сортировки, то все столбцы, являющиеся частью ключа сортировки, имеют положительное значение, указывающее положение столбца в ключе сортировки.\r\nЕсли в таблице используется чередующийся ключ сортировки, то каждый столбец, являющийся частью ключа сортировки, имеет поочередно положительное или отрицательное значение, где абсолютное значение указывает положение столбца в ключе сортировки.\r\nЕсли 0, столбец не является частью ключа сортировки.
