# tool vacuum #
tasks.vacuum.table.node.name = Сборка мусора таблицы
tasks.vacuum.table.node.description = Сборка мусора таблиц(ы)
tasks.vacuum.database.node.name = Сборка мусора БД
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Full
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Выбирает «полный» вакуум, который может освободить больше места\r\nно занимает гораздо больше времени и эксклюзивно блокирует таблицу.\r\nЭтот метод также требует дополнительного дискового пространства, так как он записывает новую копию таблицы\r\nи не освобождает старую копию до операции завершения.\r\nИспользовать только в том случае, если из таблицы необходимо извлечь значительный объем.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Freeze
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Выбирает агрессивное «замораживание» кортежей. Указание FREEZE эквивалентно выполнению \r\nVACUUM с параметрами vacuum_freeze_min_age и vacuum_freeze_table_age, установленными на ноль.\r\nАгрессивное замораживание всегда выполняется, когда таблица перезаписывается,\r\nпоэтому этот параметр является избыточным, если задано значение FULL
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analyzed
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Обновляет статистику, используемую для создания лучшей схемы выполнения запроса.
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Disable page skipping
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Обычно VACUUM пропускает страницы на основе карты видимости. \r\nСтраницы, где известно, что все кортежи заморожены, всегда могут быть пропущены,\r\nа те, где все кортежи известны как видимые для всех транзакций, могут быть пропущены, кроме случаев, когда выполняется агрессивный вакуум.\r\nЗа исключением случаев выполнения агрессивного вакуума, некоторые страницы могут быть\r\nпропущены во избежание ожидания завершения их использования другими сеансами.\r\nЭтот параметр отключает все действия по пропуску страниц\n Работает, начиная с PostgreSQL 9.6
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Указывает, что команда VACUUM должна попытаться удалить элементы индекса, указывающие на «мёртвые» кортежи.\n Обычно это желательная операция и она выполняется по умолчанию, если только для таблицы, подлежащей очистке, не задан параметр vacuum_index_cleanup.\n Отключать эту операцию может иметь смысл, когда нужно выполнить очистку как можно быстрее,\n например для предотвращения надвигающейся угрозы зацикливания идентификаторов транзакций.\n Однако если очистка индекса не производится регулярно,\n производительность может ухудшаться, так как по мере внесения изменений в таблицу индексы будут накапливать «мёртвые» кортежи,\n а сама таблица будет накапливать «мёртвые» указатели, которые могут быть удалены только после очистки индекса.\n Это указание не действует для таблиц, в которых нет индексов, и игнорируется в случае использования указания FULL.\n Работает, начиная с PostgreSQL 12
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Указывает, что команда VACUUM должна попытаться обрезать пустые страницы в конце таблицы,\n чтобы освободившееся место было возвращено операционной системе. Обычно это желательная операция и она выполняется по умолчанию,\n если только для таблицы, подлежащей очистке, не сброшен параметр vacuum_truncate.\n Отключать эту операцию может иметь смысл, чтобы избежать блокировки ACCESS EXCLUSIVE для таблицы, подлежащей очистке.\n Это указание игнорируется в случае использования указания FULL.\n Работает, начиная с PostgreSQL 12
meta.com.seizia.chromite.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Указывает, что команда VACUUM не должна ждать освобождения никаких конфликтующих блокировок, начиная обработку отношения:\n если отношение не удаётся заблокировать сразу, без ожидания, оно пропускается.\n Заметьте, что даже с этим указанием VACUUM может заблокироваться, открывая индексы отношения.\n Кроме того, VACUUM ANALYZE может заблокироваться и при получении выборки строк из секций, потомков в иерархии наследования или некоторых видов сторонних таблиц.\n Учтите также, что при наличии конфликтующей блокировки в секционированной таблице команда VACUUM\n с этим указанием пропускает все её секции, тогда как обычно все они обрабатываются.\n Работает, начиная с PostgreSQL 12

