meta.com.seizia.chromite.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description = Opcja CASCADE pozwala sprawdzić obiekt wraz ze wszystkimi obiektami zależnymi (na przykład indeksami).\n Domyślnie CASCADE wykonuje pełne sprawdzenie. Ponieważ ta operacja może być zasobożerna,\n można wykonać szybszą wersję sprawdzenia za pomocą klauzuli FAST.\n Można też sprawdzać strukturę w trybie online, podczas gdy na obiekcie wykonywane są operacje DML.\n Sprawdzanie przy trwających operacjach DML może nieco obniżyć wydajność,\n ale rekompensuje to możliwość wykonania ANALYZE w trybie online.
