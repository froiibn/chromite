meta.com.seizia.chromite.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.description = Użyj REUSE STORAGE, aby zachować miejsce po usuniętych wierszach przydzielone tabeli.\n Parametry przechowywania nie są przywracane do wartości z chwili utworzenia tabeli lub klastra.\n To miejsce może być potem użyte tylko przez nowe dane tabeli lub klastra pochodzące z operacji wstawiania lub aktualizacji.\n Ta klauzula pozostawia bieżące ustawienia parametrów przechowywania.
