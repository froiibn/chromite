node_run_details = 작업 실행 기록
node_running_jobs = 실행 중인 작업

state_running = 실행 중
state_stopped = 중지됨(job_queue_processes = 0)
state_disabled = 사용 안 함(SCHEDULER_DISABLED)
state_unknown = 알 수 없음

error_permission = 이 Oracle 스케줄러 작업을 할 권한이 없습니다. 작업을 만들려면 CREATE JOB 권한(다른 스키마는 CREATE ANY JOB)이, 작업을 강제로 중지하려면 MANAGE SCHEDULER 권한이 필요합니다.
error_not_running = Oracle 스케줄러가 작업을 실행하지 않습니다(job_queue_processes가 0이거나 스케줄러를 사용하지 않음).
