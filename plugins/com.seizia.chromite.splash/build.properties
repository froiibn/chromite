# Images only, no code. The native launcher reads splash.png from the installed folder of this bundle before the JVM
# starts (-showsplash in chromite-swing.product), so the bundle is installed as a folder (Eclipse-BundleShape: dir).
# Both images are generated by tools/branding/gen_app_icons.py (docs/chromite/branding.md).
bin.includes = META-INF/,\
               splash.png,\
               splash@2x.png
