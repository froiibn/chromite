sql_script_task_txn_before = 연결 {0}의 세션에 커밋하지 않은 트랜잭션이 있습니다.\n\n''{1}'' 작업은 이 세션에서 스크립트를 실행하므로 스크립트의 변경이 그 트랜잭션에 섞입니다. 먼저 커밋하시겠습니까, 롤백하시겠습니까? 취소하면 작업을 실행하지 않습니다.
sql_script_task_txn_after = ''{0}'' 작업이 연결 {1}의 세션에 커밋하지 않은 트랜잭션을 남겼습니다.\n\n스크립트의 변경을 커밋하시겠습니까, 롤백하시겠습니까? 열어 두기를 고르면 트랜잭션을 그대로 둡니다(나중에 도구 > 열린 트랜잭션에서 끝낼 수 있음).
