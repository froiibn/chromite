database_transfer_consumer_txn_before = 연결 {0}의 세션에 커밋하지 않은 트랜잭션이 있습니다.\n\n{1}에 넣기는 이 세션에서 실행되므로(새 연결을 열지 않음) 그 트랜잭션이 넣기와 함께 커밋되거나 롤백됩니다. 먼저 커밋하거나 롤백하시겠습니까? 취소를 고르면 데이터를 넣지 않습니다.
