# Labels of the server administration tools (session filters and actions), as in the SWT session editors
filter_show_idle=Show idle connections
filter_show_idle_tip=Show sessions that are idle or idle in transaction
filter_only_connections=Only connections
filter_only_connections_tip=Show only sessions with a physical connection (no internal tasks)
filter_hide_sleeping=Hide sleeping
filter_hide_sleeping_tip=Show only active connections
filter_show_performance=Show performance info
filter_show_performance_tip=Show extra performance data from the sys schema
filter_show_background=Show background
filter_show_background_tip=Show background tasks
filter_show_inactive=Show inactive
filter_show_inactive_tip=Show inactive sessions
action_terminate=Terminate Session
action_terminate_tip=End the selected sessions (their connections are closed)
action_cancel_query=Cancel Query
action_cancel_query_tip=Cancel the running query of the selected sessions; the sessions stay connected
action_kill_session=Kill Session
action_kill_session_tip=End the selected sessions
action_kill_query=Kill Query
action_kill_query_tip=Stop the running statement of the selected sessions; the sessions stay connected
action_disconnect_session=Disconnect Session
action_disconnect_session_tip=Disconnect the selected sessions after their current transaction
action_immediate=Immediate (roll back and end the session now)
