log_postgres_level_errors=ERROR, FATAL, PANIC
log_postgres_version=Reading the server log needs PostgreSQL 10 or later (pg_ls_logdir, pg_current_logfile).
log_postgres_no_collector=The server does not write log files: logging_collector is off, so the log goes to the standard error of the server process and cannot be read through SQL.
log_postgres_no_permission=This login cannot read the server log files. It needs superuser, or pg_monitor plus GRANT EXECUTE ON FUNCTION pg_read_binary_file(text, bigint, bigint, boolean) (and pg_read_server_files when log_directory is outside the data directory).
log_postgres_no_file_destination=The server writes no log files that can be read (log_destination = {0}). Use stderr, csvlog or jsonlog with logging_collector on.
log_postgres_no_files=The log directory has no files of this format.
log_mysql_error_log=Error log
log_mysql_slow_log=Slow query log
log_mysql_stderr=the standard error of the server
log_mysql_mariadb_error_log=MariaDB does not provide its error log through SQL. It is written to {0}.
log_mysql_old_error_log=Reading the error log through SQL needs MySQL 8.0.22 or later (performance_schema.error_log). It is written to {0}.
log_mysql_no_permission=This login cannot read {0}. Grant SELECT on it. Server message: {1}
log_mysql_slow_off=The slow query log is off (slow_query_log = OFF).
log_mysql_slow_file=The slow query log is written to a file, not to a table (log_output = {0}, file {1}). Only log_output = TABLE can be read through SQL.
log_mysql_slow_detail=Query time: {0}\nLock time: {1}\nRows sent: {2}\nRows examined: {3}\nDatabase: {4}
log_oracle_alert_log=Alert log
log_oracle_version=Reading the alert log needs Oracle 11g or later (V$DIAG_ALERT_EXT).
log_oracle_no_permission=This login cannot read {0}. Grant SELECT ANY DICTIONARY, or SELECT on SYS.V_$DIAG_ALERT_EXT (SYS grants it; SELECT_CATALOG_ROLE does not include this view). Server message: {1}
log_oracle_level_ora=ORA- errors
