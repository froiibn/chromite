maint_grid_pg_vacuum=Vacuum and Analyze ({0})
maint_grid_pg_bloat=Bloat (Estimate)
maint_pg_vacuum_desc=Tables of the connected database by dead rows. Autovacuum / threshold / scale factor: {0}.
maint_pg_bloat_desc=Estimate from planner statistics (pg_stats, reltuples), not a measurement. Run ANALYZE first for a better estimate. Only tables whose column statistics this login can read are included. VACUUM FULL or CLUSTER gives the space back.
maint_pg_vacuum_op_desc=Removes dead rows so that their space can be reused, and optionally collects statistics.
maint_pg_analyze_op_desc=Collects statistics for the planner.
maint_pg_reindex_op_desc=Rebuilds indexes (for example bloated or corrupted ones).
maint_pg_cluster_desc=Rewrites the table in the order of an index.
maint_pg_cluster_database_desc=Reclusters every table of the database that was clustered before (tables this login owns).
maint_pg_cluster_previous=(Index used last time)
maint_pg_cluster_index_tip=The table is rewritten in the order of this index
maint_pg_full_tip=Rewrites the whole table and gives the space back to the operating system; locks the table exclusively
maint_pg_freeze_tip=Freezes all rows (as with vacuum_freeze_min_age = 0)
maint_pg_vacuum_analyze_tip=Also collects statistics after vacuuming
maint_pg_concurrently_tip=Rebuilds without blocking writes; takes longer and cannot run on system catalogs
maint_pg_concurrently_version=CONCURRENTLY needs PostgreSQL 12 or later
maint_pg_warn_full=VACUUM FULL holds an ACCESS EXCLUSIVE lock on the table until it finishes: every read and write of the table waits. It also needs free disk space for a full copy of the table.
maint_pg_warn_cluster=CLUSTER holds an ACCESS EXCLUSIVE lock on the table until it finishes: every read and write of the table waits.
maint_pg_warn_reindex=REINDEX without CONCURRENTLY blocks writes to the table, and reads that use the index, until it finishes.
maint_pg_warn_concurrently=REINDEX CONCURRENTLY takes longer. If it fails, it can leave an invalid index (name ending in _ccnew) that must be dropped.
maint_pg_denied_table=This login cannot maintain the table: only its owner (or a member of the owner role), the database owner (VACUUM and ANALYZE) or a superuser can.
maint_pg_denied_table_17=This login cannot maintain the table: it needs the MAINTAIN privilege on the table (or the pg_maintain role), ownership of the table, or superuser.
maint_pg_denied_schema=REINDEX SCHEMA needs ownership of the schema, the pg_maintain role (PostgreSQL 17+) or superuser.
maint_pg_denied_database=REINDEX DATABASE needs ownership of the database, the pg_maintain role (PostgreSQL 17+) or superuser.
maint_pg_schema_empty=The schema has no tables.
maint_pg_other_database=The target is in database {0}, but the connection is to {1}. Open it from the Object Explorer node of that database.
maint_pg_fact_rows=Live rows: {0}, dead rows: {1}, changed since analyze: {2}, total size: {3}
maint_pg_fact_times=Last vacuum: {0}, autovacuum: {1}, analyze: {2}, autoanalyze: {3}
maint_pg_fact_clustered=Clustered on index {0}
maint_pg_fact_schema_tables=This login can maintain {0} of the {1} tables of the schema; statements are made for those tables only.
maint_pg_fact_database_skips=This login is not the database owner or a superuser: the server skips the tables it does not own, with a warning.
maint_grid_my_tables=Free Space
maint_grid_my_statistics=InnoDB Statistics
maint_my_tables_desc=Tables by unused space (DATA_FREE). OPTIMIZE TABLE gives it back. Values come from the cached statistics of information_schema.
maint_my_statistics_desc=Persistent InnoDB statistics, oldest first (mysql.innodb_table_stats). ANALYZE TABLE updates them.
maint_my_statistics_denied=This login cannot read mysql.innodb_table_stats (needs SELECT on the mysql database).
maint_my_partial=This login has no global SELECT privilege: only the tables it has privileges on are listed.
maint_my_analyze_desc=Updates the index statistics of the table.
maint_my_optimize_desc=Rebuilds the table to give back unused space and defragment the data.
maint_my_check_desc=Checks the table for errors.
maint_my_repair_desc=Repairs a corrupted table (MyISAM, Aria, ARCHIVE and CSV tables).
maint_my_local_tip=Do not write the statement to the binary log (replicas do not run it)
maint_my_check_mode_tip=QUICK and FAST are lighter, EXTENDED checks every row; FOR UPGRADE checks compatibility with the server version
maint_my_warn_optimize=On InnoDB, OPTIMIZE TABLE rebuilds the table (the result says "recreate + analyze"). It needs free disk space for a copy of the table and briefly locks the table at the start and the end.
maint_my_warn_repair=REPAIR TABLE repairs MyISAM, Aria, ARCHIVE and CSV tables only. It repairs nothing in InnoDB tables, even when the result says OK. Back up the table first.
maint_my_denied=This login cannot run this on the tables: ANALYZE, OPTIMIZE and REPAIR TABLE need the SELECT and INSERT privileges on each table.
maint_my_schema_empty=The database has no tables.
maint_my_fact_table=Engine: {0}, rows (est.): {1}, free bytes: {2} ({3}%)
maint_my_fact_times=Last update: {0}, last check: {1}
maint_my_fact_schema_tables={0} tables
maint_my_fact_partial=This login can analyze, optimize and repair {0} of the {1} tables; the statements name those tables only.
maint_grid_ora_invalid=Invalid Objects
maint_grid_ora_stale=Stale Statistics
maint_grid_ora_unusable=Unusable Indexes
maint_ora_invalid_desc=Objects with status INVALID. Select one to see its compile errors; recompile it or the whole schema.
maint_ora_stale_desc=Tables whose statistics are stale or were never gathered (STALE_STATS, LAST_ANALYZED).
maint_ora_unusable_desc=Indexes with status UNUSABLE (for example after a table move). Queries cannot use them until they are rebuilt. Partitions of partitioned indexes are not listed.
maint_ora_missing_views=This login cannot read {0}: only the objects it can access are listed. Grant SELECT_CATALOG_ROLE (or SELECT ANY DICTIONARY) to see all schemas.
maint_ora_gather_table=Gather Table Statistics
maint_ora_gather_index=Gather Index Statistics
maint_ora_gather_schema=Gather Schema Statistics
maint_ora_gather_desc=Collects optimizer statistics with DBMS_STATS.
maint_ora_sample_auto=Automatic (recommended)
maint_ora_sample_tip=Share of the rows read (estimate_percent); automatic lets Oracle decide
maint_ora_cascade=Include indexes
maint_ora_cascade_tip=Also gathers the statistics of the indexes (cascade)
maint_ora_gather_all=All objects (GATHER)
maint_ora_gather_stale=Stale only (GATHER STALE)
maint_ora_gather_empty=Without statistics only (GATHER EMPTY)
maint_ora_rebuild=Rebuild Index
maint_ora_rebuild_desc=Rebuilds the index (makes an unusable index usable again).
maint_ora_online_tip=Keeps the table writable during the rebuild (Enterprise Edition feature)
maint_ora_warn_rebuild=Without ONLINE, the rebuild locks the table against writes until it finishes.
maint_ora_validate=Validate Structure
maint_ora_validate_desc=Checks the table blocks and rows for corruption (ANALYZE TABLE ... VALIDATE STRUCTURE). A damaged block stops it with an error.
maint_ora_validate_cascade=Indexes
maint_ora_validate_cascade_tip=CASCADE also checks the indexes and that they match the table rows; FAST only compares checksums; ONLINE does not lock the table.
maint_ora_validate_table_only=Table only
maint_ora_warn_validate=Without ONLINE, the check locks the table against writes until it finishes.
maint_ora_compile=Compile
maint_ora_compile_desc=Recompiles the object (ALTER ... COMPILE) and shows its compile errors.
maint_ora_compile_schema=Compile Invalid Objects of {0}
maint_ora_compile_schema_desc=Recompiles the objects of the schema and shows the remaining compile errors.
maint_ora_method_invalid=DBMS_UTILITY.COMPILE_SCHEMA (invalid objects)
maint_ora_method_each=ALTER ... COMPILE for each invalid object
maint_ora_method_all=DBMS_UTILITY.COMPILE_SCHEMA (all objects)
maint_ora_method_tip=COMPILE_SCHEMA resolves the order of dependencies; ALTER ... COMPILE shows a result per object
maint_ora_warn_compile=Compiling is DDL: it commits nothing of yours (it runs on its own connection) but it can invalidate dependent objects and cursors in use for a moment.
maint_ora_warn_compile_all=Compiling all objects of the schema takes long and invalidates every dependent object until it is recompiled.
maint_ora_compile_unsupported=Objects of type {0} cannot be compiled with ALTER ... COMPILE.
maint_ora_denied=This login cannot do this on another schema: it needs the {0} system privilege.
maint_ora_fact_table=Rows (statistics): {0}, last analyzed: {1}, stale: {2}
maint_ora_fact_index=Status: {0}, last analyzed: {1}, B-tree level: {2}, leaf blocks: {3}
maint_ora_fact_object=Type: {0}, status: {1}, last DDL: {2}
maint_ora_fact_schema=Invalid objects: {0}, tables with stale or missing statistics: {1}
maint_grid_ms_fragmentation=Index Fragmentation ({0})
maint_grid_ms_statistics=Statistics ({0})
maint_grid_ms_checkdb=Database Integrity
maint_ms_fragmentation_desc=Indexes fragmented 5% or more (sys.dm_db_index_physical_stats, LIMITED). Suggested: 5-30% REORGANIZE, over 30% REBUILD. Indexes under about 1,000 pages rarely gain from either.
maint_ms_statistics_desc=Statistics by rows modified since their last update (sys.dm_db_stats_properties).
maint_ms_checkdb_desc=Last DBCC CHECKDB without errors per database, oldest first.
maint_ms_denied_view_state=This login cannot read the index and statistics state of {0}: grant VIEW DATABASE STATE (or VIEW DATABASE PERFORMANCE STATE on SQL Server 2022) in that database.
maint_ms_denied_alter=This login cannot maintain {0}: index and statistics maintenance needs the ALTER permission on the table.
maint_ms_denied_owner=This login cannot do this: it needs the sysadmin server role or the db_owner role in the database.
maint_ms_rebuild=Rebuild
maint_ms_rebuild_all=Rebuild All Indexes
maint_ms_rebuild_desc=Drops and re-creates the index: removes all fragmentation and updates its statistics with a full scan.
maint_ms_reorganize=Reorganize
maint_ms_reorganize_all=Reorganize All Indexes
maint_ms_reorganize_desc=Reorders the leaf pages in place; always online and can be stopped at any time without losing the work done.
maint_ms_update_statistics=Update Statistics
maint_ms_update_statistics_desc=Updates the query optimization statistics.
maint_ms_update_all_statistics=Update All Statistics (sp_updatestats)
maint_ms_update_all_statistics_desc=Updates the statistics of every table in the database that have modifications.
maint_ms_checkdb_op_desc=Checks the logical and physical integrity of every object of the database.
maint_ms_online_tip=Keeps the table available during the rebuild
maint_ms_online_edition=ONLINE needs Enterprise, Developer or Evaluation edition (or Azure SQL)
maint_ms_sort_tip=Sorts in tempdb instead of the database of the index
maint_ms_lob_tip=Also compacts large object (LOB) data
maint_ms_scan_default=Default sample
maint_ms_scan_tip=FULLSCAN reads every row; SAMPLE reads a share; RESAMPLE uses the last rate
maint_ms_no_infomsgs_tip=Report errors only
maint_ms_physical_only_tip=Checks only the physical structure: much faster, finds torn pages and checksum failures
maint_ms_warn_offline=An offline rebuild holds a schema modification lock on the table: queries on the table wait until it finishes.
maint_ms_warn_fullscan=FULLSCAN reads the whole table; on large tables this takes long and loads the server.
maint_ms_warn_checkdb=DBCC CHECKDB reads every page of the database and can run for a long time under heavy I/O. You can cancel it while it runs.
maint_ms_suggest_none=none needed
maint_ms_locked=The index state cannot be read now: a table is locked (for example by a long transaction or an offline rebuild). Try again later.
maint_ms_fact_fragmentation=Fragmentation: {0}% of {1} pages; suggested: {2}
maint_ms_fact_statistics=Statistics last updated: {0}
maint_ms_fact_checkdb=Last good DBCC CHECKDB: {0}
