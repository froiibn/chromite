# Activity Monitor: permission notices and session command results (PostgreSQL, Oracle)
access_postgres_own_sessions=Only your own sessions are shown: this login is not a superuser and not a member of pg_monitor (or pg_read_all_stats). Grant pg_monitor to see all sessions.
access_oracle_missing_views=This login cannot read {0}. Grant SELECT_CATALOG_ROLE (or SELECT on these views) to see all sessions and locks.
access_oracle_no_alter_system=This login has no ALTER SYSTEM privilege, so it cannot kill sessions.
session_not_ended=Session {0} was not ended: it no longer exists or this login may not signal it.
