# Activity Monitor: permission notices and session command results (PostgreSQL, Oracle)
access_postgres_own_sessions=자신의 세션만 표시합니다. 이 로그인은 superuser가 아니고 pg_monitor(또는 pg_read_all_stats)의 멤버도 아닙니다. 모든 세션을 보려면 pg_monitor를 부여하십시오.
access_oracle_missing_views=이 로그인은 {0}을(를) 읽을 수 없습니다. 모든 세션과 잠금을 보려면 SELECT_CATALOG_ROLE(또는 이 뷰의 SELECT 권한)을 부여하십시오.
access_oracle_no_alter_system=이 로그인에는 ALTER SYSTEM 권한이 없어 세션을 종료할 수 없습니다.
session_not_ended=세션 {0}을(를) 종료하지 못했습니다. 세션이 이미 없거나 이 로그인으로는 신호를 보낼 수 없습니다.
