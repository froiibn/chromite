maint_pg_vacuum_desc=연결한 데이터베이스의 테이블(죽은 행이 많은 순). 자동 VACUUM / 기준값 / 비율: {0}.
maint_pg_bloat_desc=측정값이 아니라 플래너 통계(pg_stats, reltuples)로 계산한 추정치입니다. 먼저 ANALYZE를 실행하면 더 정확합니다. 이 로그인이 열 통계를 읽을 수 있는 테이블만 포함합니다. 공간은 VACUUM FULL 또는 CLUSTER로 돌려받습니다.
maint_pg_vacuum_op_desc=죽은 행을 정리해 그 공간을 다시 쓸 수 있게 하고, 선택하면 통계도 수집합니다.
maint_pg_analyze_op_desc=플래너가 쓰는 통계를 수집합니다.
maint_pg_reindex_op_desc=인덱스를 다시 만듭니다(부풀었거나 손상된 인덱스 등).
maint_pg_cluster_desc=테이블을 인덱스 순서로 다시 씁니다.
maint_pg_cluster_database_desc=전에 CLUSTER한 데이터베이스의 모든 테이블을 다시 정렬합니다(이 로그인이 소유한 테이블).
maint_pg_cluster_previous=(지난번에 쓴 인덱스)
maint_pg_cluster_index_tip=이 인덱스 순서로 테이블을 다시 씁니다
maint_pg_full_tip=테이블 전체를 다시 써서 공간을 운영 체제에 돌려줍니다. 테이블을 배타적으로 잠급니다
maint_pg_freeze_tip=모든 행을 고정합니다(vacuum_freeze_min_age = 0과 같음)
maint_pg_vacuum_analyze_tip=VACUUM 뒤에 통계도 수집합니다
maint_pg_concurrently_tip=쓰기를 막지 않고 다시 만듭니다. 더 오래 걸리고 시스템 카탈로그에는 쓸 수 없습니다
maint_pg_concurrently_version=CONCURRENTLY는 PostgreSQL 12 이상이 필요합니다
maint_pg_warn_full=VACUUM FULL은 끝날 때까지 테이블에 ACCESS EXCLUSIVE 잠금을 겁니다. 그동안 테이블의 모든 읽기와 쓰기가 기다립니다. 테이블 전체를 복사할 디스크 공간도 필요합니다.
maint_pg_warn_cluster=CLUSTER는 끝날 때까지 테이블에 ACCESS EXCLUSIVE 잠금을 겁니다. 그동안 테이블의 모든 읽기와 쓰기가 기다립니다.
maint_pg_warn_reindex=CONCURRENTLY 없는 REINDEX는 끝날 때까지 테이블 쓰기와 그 인덱스를 쓰는 읽기를 막습니다.
maint_pg_warn_concurrently=REINDEX CONCURRENTLY는 더 오래 걸립니다. 실패하면 무효 인덱스(이름이 _ccnew로 끝남)가 남을 수 있으며 삭제해야 합니다.
maint_pg_denied_table=이 로그인은 이 테이블을 유지 관리할 수 없습니다. 테이블 소유자(소유 역할의 구성원), 데이터베이스 소유자(VACUUM, ANALYZE) 또는 superuser만 할 수 있습니다.
maint_pg_denied_table_17=이 로그인은 이 테이블을 유지 관리할 수 없습니다. 테이블의 MAINTAIN 권한(또는 pg_maintain 역할), 테이블 소유권 또는 superuser가 필요합니다.
maint_pg_denied_schema=REINDEX SCHEMA는 스키마 소유권, pg_maintain 역할(PostgreSQL 17+) 또는 superuser가 필요합니다.
maint_pg_denied_database=REINDEX DATABASE는 데이터베이스 소유권, pg_maintain 역할(PostgreSQL 17+) 또는 superuser가 필요합니다.
maint_pg_schema_empty=스키마에 테이블이 없습니다.
maint_pg_other_database=대상은 {0} 데이터베이스에 있지만 연결은 {1} 데이터베이스입니다. 그 데이터베이스의 개체 탐색기 노드에서 여십시오.
maint_pg_fact_rows=활성 행: {0}, 죽은 행: {1}, 분석 뒤 변경: {2}, 전체 크기: {3}
maint_pg_fact_times=마지막 VACUUM: {0}, 자동 VACUUM: {1}, ANALYZE: {2}, 자동 ANALYZE: {3}
maint_pg_fact_clustered=CLUSTER 인덱스: {0}
maint_pg_fact_schema_tables=이 로그인은 스키마의 테이블 {1}개 중 {0}개를 유지 관리할 수 있습니다. 그 테이블에 대해서만 문장을 만듭니다.
maint_pg_fact_database_skips=이 로그인은 데이터베이스 소유자나 superuser가 아닙니다. 서버는 소유하지 않은 테이블을 경고와 함께 건너뜁니다.
maint_grid_my_tables=빈 공간
maint_grid_my_statistics=InnoDB 통계
maint_my_tables_desc=쓰지 않는 공간(DATA_FREE)이 큰 순서입니다. OPTIMIZE TABLE로 돌려받습니다. 값은 information_schema의 캐시된 통계입니다.
maint_my_statistics_desc=InnoDB 영구 통계(mysql.innodb_table_stats), 오래된 순서입니다. ANALYZE TABLE로 업데이트합니다.
maint_my_statistics_denied=이 로그인은 mysql.innodb_table_stats를 읽을 수 없습니다(mysql 데이터베이스의 SELECT 필요).
maint_my_partial=이 로그인에는 전역 SELECT 권한이 없어 권한이 있는 테이블만 표시합니다.
maint_my_analyze_desc=테이블의 인덱스 통계를 업데이트합니다.
maint_my_optimize_desc=테이블을 다시 만들어 쓰지 않는 공간을 돌려받고 데이터 조각을 모읍니다.
maint_my_check_desc=테이블에 오류가 있는지 검사합니다.
maint_my_repair_desc=손상된 테이블을 복구합니다(MyISAM, Aria, ARCHIVE, CSV 테이블).
maint_my_local_tip=문장을 바이너리 로그에 쓰지 않습니다(복제본에서 실행되지 않음)
maint_my_check_mode_tip=QUICK·FAST는 가볍고 EXTENDED는 모든 행을 검사합니다. FOR UPGRADE는 서버 버전과의 호환성을 검사합니다
maint_my_warn_optimize=InnoDB에서 OPTIMIZE TABLE은 테이블을 다시 만듭니다(결과에 "recreate + analyze"로 표시). 테이블 복사본을 만들 디스크 공간이 필요하고 시작과 끝에 잠깐 테이블을 잠급니다.
maint_my_warn_repair=REPAIR TABLE은 MyISAM, Aria, ARCHIVE, CSV 테이블만 복구합니다. InnoDB 테이블은 결과가 OK여도 복구하지 않습니다. 먼저 테이블을 백업하십시오.
maint_my_denied=이 로그인은 테이블에 이 작업을 할 수 없습니다. ANALYZE, OPTIMIZE, REPAIR TABLE은 테이블마다 SELECT와 INSERT 권한이 필요합니다.
maint_my_schema_empty=데이터베이스에 테이블이 없습니다.
maint_my_fact_table=엔진: {0}, 행 수(추정): {1}, 빈 공간 바이트: {2} ({3}%)
maint_my_fact_times=마지막 변경: {0}, 마지막 검사: {1}
maint_my_fact_schema_tables=테이블 {0}개
maint_my_fact_partial=이 로그인은 테이블 {1}개 중 {0}개를 분석·최적화·복구할 수 있습니다. 문장에는 그 테이블만 넣습니다.
maint_grid_ora_invalid=무효 개체
maint_grid_ora_stale=오래된 통계
maint_grid_ora_unusable=사용할 수 없는 인덱스
maint_ora_invalid_desc=상태가 INVALID인 개체입니다. 고르면 컴파일 오류를 봅니다. 개체 하나나 스키마 전체를 다시 컴파일합니다.
maint_ora_stale_desc=통계가 오래되었거나 한 번도 수집하지 않은 테이블입니다(STALE_STATS, LAST_ANALYZED).
maint_ora_unusable_desc=상태가 UNUSABLE인 인덱스입니다(예: 테이블 이동 뒤). 다시 작성할 때까지 쿼리가 쓰지 못합니다. 분할 인덱스의 파티션은 표시하지 않습니다.
maint_ora_missing_views=이 로그인은 {0}을(를) 읽을 수 없어 접근할 수 있는 개체만 표시합니다. 모든 스키마를 보려면 SELECT_CATALOG_ROLE(또는 SELECT ANY DICTIONARY)을 부여하십시오.
maint_ora_gather_table=테이블 통계 수집
maint_ora_gather_index=인덱스 통계 수집
maint_ora_gather_schema=스키마 통계 수집
maint_ora_gather_desc=DBMS_STATS로 옵티마이저 통계를 수집합니다.
maint_ora_sample_auto=자동(권장)
maint_ora_sample_tip=읽을 행의 비율(estimate_percent). 자동이면 Oracle이 정합니다
maint_ora_cascade=인덱스 포함
maint_ora_cascade_tip=인덱스의 통계도 수집합니다(cascade)
maint_ora_gather_all=모든 개체(GATHER)
maint_ora_gather_stale=오래된 것만(GATHER STALE)
maint_ora_gather_empty=통계가 없는 것만(GATHER EMPTY)
maint_ora_rebuild=인덱스 다시 작성
maint_ora_rebuild_desc=인덱스를 다시 만듭니다(사용할 수 없는 인덱스를 다시 쓸 수 있게 합니다).
maint_ora_online_tip=다시 작성하는 동안 테이블에 쓸 수 있게 합니다(Enterprise Edition 기능)
maint_ora_warn_rebuild=ONLINE이 없으면 다시 작성이 끝날 때까지 테이블 쓰기를 막습니다.
maint_ora_validate=구조 검증
maint_ora_validate_desc=테이블의 블록과 행이 손상되었는지 검사합니다(ANALYZE TABLE ... VALIDATE STRUCTURE). 손상된 블록이 있으면 오류로 멈춥니다.
maint_ora_validate_cascade=인덱스
maint_ora_validate_cascade_tip=CASCADE는 인덱스와 인덱스가 테이블 행과 맞는지도 검사합니다. FAST는 체크섬만 비교하고, ONLINE은 테이블을 잠그지 않습니다.
maint_ora_validate_table_only=테이블만
maint_ora_warn_validate=ONLINE이 없으면 검사가 끝날 때까지 테이블 쓰기를 막습니다.
maint_ora_compile=컴파일
maint_ora_compile_desc=개체를 다시 컴파일하고(ALTER ... COMPILE) 컴파일 오류를 보입니다.
maint_ora_compile_schema={0}의 무효 개체 컴파일
maint_ora_compile_schema_desc=스키마의 개체를 다시 컴파일하고 남은 컴파일 오류를 보입니다.
maint_ora_method_invalid=DBMS_UTILITY.COMPILE_SCHEMA(무효 개체)
maint_ora_method_each=무효 개체마다 ALTER ... COMPILE
maint_ora_method_all=DBMS_UTILITY.COMPILE_SCHEMA(모든 개체)
maint_ora_method_tip=COMPILE_SCHEMA는 종속 순서를 알아서 처리하고, ALTER ... COMPILE은 개체마다 결과를 보입니다
maint_ora_warn_compile=컴파일은 DDL입니다. 별도 연결에서 실행하므로 사용자의 트랜잭션은 커밋하지 않지만, 종속 개체와 사용 중인 커서가 잠시 무효가 될 수 있습니다.
maint_ora_warn_compile_all=스키마의 모든 개체를 컴파일하면 오래 걸리고, 다시 컴파일될 때까지 종속 개체가 모두 무효가 됩니다.
maint_ora_compile_unsupported={0} 유형의 개체는 ALTER ... COMPILE로 컴파일할 수 없습니다.
maint_ora_denied=이 로그인은 다른 스키마에 이 작업을 할 수 없습니다. {0} 시스템 권한이 필요합니다.
maint_ora_fact_table=행 수(통계): {0}, 마지막 분석: {1}, 오래됨: {2}
maint_ora_fact_index=상태: {0}, 마지막 분석: {1}, B-트리 수준: {2}, 리프 블록: {3}
maint_ora_fact_object=유형: {0}, 상태: {1}, 마지막 DDL: {2}
maint_ora_fact_schema=무효 개체: {0}, 통계가 오래되었거나 없는 테이블: {1}
maint_grid_ms_fragmentation=인덱스 조각화 ({0})
maint_grid_ms_statistics=통계 ({0})
maint_grid_ms_checkdb=데이터베이스 무결성
maint_ms_fragmentation_desc=조각화가 5% 이상인 인덱스입니다(sys.dm_db_index_physical_stats, LIMITED). 권장: 5-30% REORGANIZE, 30% 초과 REBUILD. 약 1,000페이지 미만의 인덱스는 어느 쪽도 효과가 거의 없습니다.
maint_ms_statistics_desc=마지막 업데이트 뒤 수정된 행이 많은 순서의 통계입니다(sys.dm_db_stats_properties).
maint_ms_checkdb_desc=데이터베이스마다 오류 없이 끝난 마지막 DBCC CHECKDB, 오래된 순서입니다.
maint_ms_denied_view_state=이 로그인은 {0}의 인덱스·통계 상태를 읽을 수 없습니다. 그 데이터베이스에서 VIEW DATABASE STATE(SQL Server 2022는 VIEW DATABASE PERFORMANCE STATE)를 부여하십시오.
maint_ms_denied_alter=이 로그인은 {0}을(를) 유지 관리할 수 없습니다. 인덱스·통계 유지 관리에는 테이블의 ALTER 권한이 필요합니다.
maint_ms_denied_owner=이 로그인은 이 작업을 할 수 없습니다. sysadmin 서버 역할이나 데이터베이스의 db_owner 역할이 필요합니다.
maint_ms_rebuild=다시 작성
maint_ms_rebuild_all=모든 인덱스 다시 작성
maint_ms_rebuild_desc=인덱스를 삭제하고 다시 만듭니다. 조각화를 모두 없애고 통계를 전체 검색으로 업데이트합니다.
maint_ms_reorganize=다시 구성
maint_ms_reorganize_all=모든 인덱스 다시 구성
maint_ms_reorganize_desc=리프 페이지를 그 자리에서 다시 정렬합니다. 항상 온라인이며 언제 멈춰도 한 작업은 남습니다.
maint_ms_update_statistics=통계 업데이트
maint_ms_update_statistics_desc=쿼리 최적화 통계를 업데이트합니다.
maint_ms_update_all_statistics=모든 통계 업데이트(sp_updatestats)
maint_ms_update_all_statistics_desc=데이터베이스의 모든 테이블에서 수정이 있는 통계를 업데이트합니다.
maint_ms_checkdb_op_desc=데이터베이스의 모든 개체의 논리적·물리적 무결성을 검사합니다.
maint_ms_online_tip=다시 작성하는 동안 테이블을 계속 쓸 수 있게 합니다
maint_ms_online_edition=ONLINE은 Enterprise, Developer, Evaluation 에디션(또는 Azure SQL)이 필요합니다
maint_ms_sort_tip=인덱스의 데이터베이스 대신 tempdb에서 정렬합니다
maint_ms_lob_tip=LOB 데이터도 압축합니다
maint_ms_scan_default=기본 표본
maint_ms_scan_tip=FULLSCAN은 모든 행을, SAMPLE은 일부를 읽고, RESAMPLE은 지난번 비율을 씁니다
maint_ms_no_infomsgs_tip=오류만 보고합니다
maint_ms_physical_only_tip=물리 구조만 검사합니다. 훨씬 빠르며 손상된 페이지와 체크섬 오류를 찾습니다
maint_ms_warn_offline=오프라인 다시 작성은 테이블에 스키마 수정 잠금을 겁니다. 끝날 때까지 테이블의 쿼리가 기다립니다.
maint_ms_warn_fullscan=FULLSCAN은 테이블 전체를 읽습니다. 큰 테이블에서는 오래 걸리고 서버에 부하를 줍니다.
maint_ms_warn_checkdb=DBCC CHECKDB는 데이터베이스의 모든 페이지를 읽어 많은 I/O로 오래 실행될 수 있습니다. 실행 중에 취소할 수 있습니다.
maint_ms_suggest_none=필요 없음
maint_ms_locked=지금은 인덱스 상태를 읽을 수 없습니다. 테이블이 잠겨 있습니다(예: 긴 트랜잭션, 오프라인 다시 작성). 잠시 뒤 다시 시도하십시오.
maint_ms_fact_fragmentation=조각화: {1}페이지 중 {0}%, 권장: {2}
maint_ms_fact_statistics=통계 마지막 업데이트: {0}
maint_ms_fact_checkdb=마지막 정상 DBCC CHECKDB: {0}
