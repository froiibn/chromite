dashboard.sqlserver.locks.description=Lock requests that had to wait, and deadlocks, per second
dashboard.sqlserver.cacheHit.label=Buffer cache hit ratio
dashboard.sqlserver.cacheHit.description=Pages found in the buffer cache without reading from disk, in percent
dashboard.postgresql.waits.label=Active sessions by wait
