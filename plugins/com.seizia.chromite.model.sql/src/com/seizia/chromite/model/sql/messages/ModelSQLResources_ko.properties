model_sql_exec_confirm_title = 쿼리 실행 확인
model_sql_exec_confirm_message = 쿼리를 실행하시겠습니까?\n\n{0}
model_sql_exec_many_results_title = 쿼리 실행이 너무 많은 결과 집합을 반환했습니다
model_sql_exec_many_results_message = 쿼리가 결과 집합을 {0}개보다 많이 반환했습니다. 더 여시겠습니까?
model_sql_exec_lost_not_run_again = 이 쿼리를 실행하는 중에(또는 서버에 보내기 전에) 서버 연결이 끊겨 다시 실행하지 않았습니다. {0} 오류: {1}
model_sql_exec_lost_outcome_unknown = 반영되었는지 알 수 없습니다. 다시 실행하기 전에 데이터를 확인하십시오.
model_sql_exec_lost_part_may_have_run = 일부가 실행되었을 수 있습니다(여러 문장, 프로시저 호출, 블록). 다시 실행하기 전에 데이터를 확인하십시오.
model_sql_exec_lost_transaction = 세션에 커밋하지 않은 트랜잭션이 있었고, 서버가 세션과 함께 롤백했습니다.
model_sql_exec_lost_ran_again =이 쿼리를 실행하는 중에 서버 연결이 끊겼습니다. 데이터를 읽기만 하는 쿼리라 새 세션에서 다시 실행했습니다.
