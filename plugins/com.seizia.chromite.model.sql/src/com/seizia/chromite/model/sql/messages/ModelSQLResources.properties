model_sql_exec_confirm_title = Confirm query execution
model_sql_exec_confirm_message = Do you confirm query execution?\n\n{0}
model_sql_exec_many_results_title = Query execution returned too many result sets
model_sql_exec_many_results_message = Query had returned more than {0} result sets. Are you sure you want to open more?
model_sql_exec_lost_not_run_again = The connection to the server was lost while this query ran (or before it reached the server), so it was not run again. {0} Error: {1}
model_sql_exec_lost_outcome_unknown = Whether it took effect is not known: check the data before running it again.
model_sql_exec_lost_part_may_have_run = Part of it may have run (several statements, a procedure call or a block): check the data before running it again.
model_sql_exec_lost_transaction = The session had a transaction that was not committed; the server rolled it back with the session.
model_sql_exec_lost_transaction_unknown = The session had a transaction that was not committed. It ended with the session, and whether this query committed any of it is not known (DDL, a batch, a block or a procedure call can commit): check the data before running it again.
model_sql_exec_lost_ran_again =The connection to the server was lost while this query ran. It only reads data, so it was run again in a new session.
