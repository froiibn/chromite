ComplexTypeTransformer.general.description = 복합 형식의 특성을 별도의 열로 표시합니다

MapTransformer.general.description = 구조체/맵을 별도의 열 집합으로 펼칩니다

ArrayTransformer.general.description = 복합 배열 요소를 별도의 열 집합으로 펼칩니다

EpochTimeTransformer.general.description = 숫자 값을 Epoch(C, Unix, POSIX, Java 등) 시간 또는 Windows 친화적 변형의 타임스탬프로 표시합니다. 1970/01/01 00:00:00(UTC) 또는 선택한 변형의 기준 시점부터 지난 시간입니다.
EpochTimeTransformer.property.unit.description = 측정 단위(초, 밀리초 등)입니다. dotnet 계열은 기준 시점도 Unix Epoch와 다릅니다
EpochTimeTransformer.property.timezoneID.description = 표준 시간대 ID입니다. 기본값은 이 컴퓨터의 표준 시간대입니다.\n지정하는 방법은 세 가지입니다.\n\t-로컬 시간대 오프셋(+3, -04:30)\n\t-특정 시간대 오프셋(GMT+2, UTC+01:00)\n\t-지역 기반(UTC, ECT, PST 등)

RadixTransformer.general.description = 숫자를 지정한 기수로 표시합니다.

URLTransformer.general.description = 값을 URL로 표시합니다. 웹 브라우저가 들어 있는 미리 보기 패널을 제공합니다.
URLTransformer.property.pattern.label = URL 패턴
URLTransformer.property.pattern.description = URL 패턴입니다. ${value} 변수는 실제 값으로 바뀝니다.

BooleanTransformer.general.description = 숫자를 부울 값으로 표시합니다.

UUIDTransformer.general.description = 이진 값을 UUID로 표시합니다.
UUIDTransformer.property.type.label = UUID 유형
UUIDTransformer.property.type.description = version1(빅 엔디언), version2(혼합 엔디언) 또는\n ordered(최적화된 저장소를 쓰는 경우) 버전 UUID를 선택할 수 있습니다.
UUIDTransformer.property.case.label = 대/소문자
UUIDTransformer.property.case.description = 소문자 또는 대문자

BinaryTransformer.general.description = 문자열 값을 이진 데이터로 표시합니다.
BinaryTransformer.property.format.label = 이진 형식
BinaryTransformer.property.format.description = 이진 값 형식입니다.
BinaryTransformer.property.encoding.label = 문자 인코딩
BinaryTransformer.property.encoding.description = 문자열 값을 바이트로 디코딩할 때 쓰는 문자 인코딩입니다.

NumericTransformer.property.type.label = 형식
NumericTransformer.property.type.description = 문자열을 변환할 숫자 유형
